# ==========================================
# Production 운영 환경 (MySQL DB & 보안 강화)
# ==========================================
server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: false # HTTP 환경 허용 (추후 HTTPS 도메인 적용 시 true 전환)

spring:
  # 운영용 MySQL DB 연동
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:roomtherapy}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: update # 초기 운영 시 스키마 자동 동기화 (운영 안정화 시 validate 전환 권장)
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# ==========================================
# AWS S3 스토리지 연동 설정
# ==========================================
cloud:
  aws:
    s3:
      bucket: ${AWS_S3_BUCKET:roomtherapy-bucket}
    region:
      static: ${AWS_REGION:ap-northeast-2}
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}
