<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배송지 정보 수정 - Room Therapy</title>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-main: #0F172A;
            --text-sub: #64748B;
            --error: #EF4444;
            --error-bg: #FEF2F2;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px 16px;
        }
        .container {
            width: 100%;
            max-width: 520px;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 36px 32px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
        }
        .header {
            margin-bottom: 24px;
        }
        .badge {
            display: inline-block;
            background: #EEF2FF;
            color: var(--primary);
            font-weight: 700;
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 999px;
            margin-bottom: 12px;
        }
        h1 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }
        p.desc {
            color: var(--text-sub);
            font-size: 14px;
        }
        .info-box {
            background: #F1F5F9;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 24px;
        }
        .info-box strong {
            color: var(--text-main);
        }
        .alert-error {
            background: var(--error-bg);
            color: var(--error);
            border: 1px solid #FCA5A5;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 13px 15px;
            border-radius: 12px;
            border: 1px solid #CBD5E1;
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
        }
        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        .field-error {
            color: var(--error);
            font-size: 12px;
            margin-top: 5px;
            display: block;
        }
        .address-grid {
            display: grid;
            grid-template-columns: 1fr 140px;
            gap: 10px;
            margin-bottom: 10px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 15px 18px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            margin-top: 24px;
            text-align: center;
        }
        .btn-primary {
            background-color: var(--primary);
            color: #FFFFFF;
        }
        .btn-primary:hover {
            background-color: var(--primary-hover);
        }
        .btn-link {
            background: transparent;
            color: var(--text-sub);
            font-size: 14px;
            margin-top: 12px;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <span class="badge">EDIT DELIVERY</span>
            <h1>배송지 정보 수정</h1>
            <p class="desc">주문 상태가 접수/준비 중일 때 배송지를 변경할 수 있습니다.</p>
        </div>

        <div class="info-box">
            신청 상품: <strong th:text="${order.goodsName}">스테이지 리워드</strong><br>
            인증 코드: <strong th:text="${order.stageCode}">ew-1010-clear</strong>
        </div>

        <div class="alert-error" th:if="${errorMessage != null}" th:text="${errorMessage}">
            수정에 실패했습니다.
        </div>

        <form th:action="@{'/delivery/edit/' + ${order.id}}" th:object="${form}" method="post">
            <div class="form-group">
                <label for="recipientName">수령인 성함</label>
                <input type="text" id="recipientName" th:field="*{recipientName}" placeholder="받으실 분의 실명을 입력하세요" required>
                <span class="field-error" th:errors="*{recipientName}"></span>
            </div>

            <div class="form-group">
                <label for="phone">연락처 (휴대폰)</label>
                <input type="tel" id="phone" th:field="*{phone}" placeholder="010-0000-0000" pattern="^010-\d{4}-\d{4}$" required>
                <span class="field-error" th:errors="*{phone}"></span>
            </div>

            <div class="form-group">
                <label>배송지 주소 및 우편번호</label>
                <div class="address-grid">
                    <input type="text" id="address" th:field="*{address}" placeholder="기본 주소 (도로명 / 지번)" required>
                    <input type="text" id="zipcode" th:field="*{zipcode}" placeholder="우편번호 (5자리)" maxlength="5" pattern="^\d{5}$" required>
                </div>
                <input type="text" id="detailAddress" th:field="*{detailAddress}" placeholder="상세 주소 (동, 호수 등)">
                <span class="field-error" th:errors="*{address}"></span>
                <span class="field-error" th:errors="*{zipcode}"></span>
            </div>

            <button type="submit" class="btn btn-primary">
                💾 수정 내용 저장하기
            </button>
            <a href="/delivery/my" class="btn btn-link">내 배송 목록으로 돌아가기</a>
        </form>
    </div>
</body>
</html>
