<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>배송지 정보 변경 - 룸테라피</title>
    <style>
        :root {
            --red: #FF4B4E;
            --title: #020202;
            --text: #3C3C3C;
            --gray: #838383;
            --bg-light: #F7F8FA;
            --border-light: #E5E7EB;
            --input-radius: 8px;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #EFEFEF;
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }
        .app-container {
            width: 100%;
            max-width: 390px;
            min-height: 100vh;
            background: #FFFFFF;
            padding: 28px 20px 40px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
        }
        @media (max-width: 440px) {
            body {
                background-color: #FFFFFF;
            }
            .app-container {
                box-shadow: none;
                min-height: 100dvh;
                padding: 22px 16px 36px;
            }
        }
        .badge-stage {
            display: inline-block;
            background: #FFEBEB;
            color: var(--red);
            font-size: 10.5px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 9999px;
            margin-bottom: 8px;
            width: fit-content;
        }
        h1 {
            font-size: 20px;
            font-weight: 800;
            color: var(--title);
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }
        p.sub-desc {
            font-size: 11px;
            color: var(--gray);
            margin-bottom: 18px;
            letter-spacing: -0.2px;
        }
        .info-card {
            background: var(--bg-light);
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 12px;
            color: var(--gray);
            margin-bottom: 18px;
            line-height: 1.5;
        }
        .info-card strong {
            color: var(--title);
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--title);
            display: block;
            margin-bottom: 6px;
        }
        .input-text {
            width: 100%;
            height: 38px;
            padding: 0 12px;
            border-radius: var(--input-radius);
            border: 1px solid var(--border-light);
            font-size: 13px;
            color: var(--text);
            outline: none;
            background: #FFFFFF;
        }
        .input-text:focus {
            border-color: var(--red);
        }
        .phone-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .phone-input {
            height: 38px;
            border-radius: var(--input-radius);
            border: 1px solid var(--border-light);
            text-align: center;
            font-size: 13px;
            color: var(--text);
            outline: none;
            background: #FFFFFF;
        }
        .phone-input:focus {
            border-color: var(--red);
        }
        .phone-part1 {
            flex: 0 0 65px;
        }
        .phone-part2, .phone-part3 {
            flex: 1;
        }
        .phone-dash {
            color: var(--gray);
            font-size: 12px;
        }
        .zip-row {
            display: flex;
            gap: 8px;
            margin-bottom: 6px;
        }
        .zip-input {
            flex: 1;
        }
        .btn-find-addr {
            flex: 0 0 84px;
            height: 38px;
            background: #F1F3F5;
            border: none;
            border-radius: var(--input-radius);
            font-size: 12px;
            font-weight: 600;
            color: var(--title);
            cursor: pointer;
        }
        .btn-find-addr:active {
            background: #E9ECEF;
        }
        .btn-submit {
            width: 100%;
            height: 44px;
            background: var(--red);
            color: #FFFFFF;
            font-size: 14px;
            font-weight: 700;
            border-radius: var(--input-radius);
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 75, 78, 0.28);
            margin-top: 10px;
            transition: opacity 0.15s ease;
        }
        .btn-submit:active {
            opacity: 0.92;
        }
        .btn-back-link {
            display: block;
            text-align: center;
            margin-top: 14px;
            font-size: 12px;
            color: var(--gray);
            text-decoration: none;
        }
        .btn-back-link:hover {
            color: var(--title);
        }
        .alert-error {
            background: #FFEBEB;
            color: var(--red);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        .field-error {
            color: var(--red);
            font-size: 11px;
            margin-top: 4px;
            display: block;
        }
    </style>
    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
</head>
<body>
    <div class="app-container">
        <span class="badge-stage">EDIT DELIVERY</span>
        <h1>배송지 정보 변경</h1>
        <p class="sub-desc">주문 상태가 접수 완료 또는 배송 준비중일 때 변경할 수 있습니다.</p>

        <div class="info-card">
            신청 굿즈: <strong th:text="${order.goodsName}">스테이지 리워드</strong><br>
            인증 코드: <strong th:text="${order.stageCode}">ew-1010-clear</strong>
        </div>

        <div class="alert-error" th:if="${errorMessage != null}" th:text="${errorMessage}">
            수정에 실패했습니다.
        </div>

        <form th:action="@{'/delivery/edit/' + ${order.id}}" th:object="${form}" method="post" id="editForm" onsubmit="syncPhoneNumber()">
            <div class="form-group">
                <label class="form-label" for="recipientName">수령인 성함</label>
                <input type="text" id="recipientName" th:field="*{recipientName}" class="input-text" placeholder="받으실 분의 실명 입력" required>
                <span class="field-error" th:errors="*{recipientName}"></span>
            </div>

            <!-- 연락처: 010 - XXXX - XXXX 3분할 칸 -->
            <div class="form-group">
                <label class="form-label">연락처 (휴대폰)</label>
                <input type="hidden" id="phone" th:field="*{phone}">
                <div class="phone-row">
                    <input type="text" id="phone1" class="phone-input phone-part1" value="010" maxlength="3" required>
                    <span class="phone-dash">-</span>
                    <input type="text" id="phone2" class="phone-input phone-part2" maxlength="4" placeholder="0000" required 
                           oninput="this.value = this.value.replace(/[^0-9]/g, ''); if(this.value.length === 4) document.getElementById('phone3').focus();">
                    <span class="phone-dash">-</span>
                    <input type="text" id="phone3" class="phone-input phone-part3" maxlength="4" placeholder="0000" required
                           oninput="this.value = this.value.replace(/[^0-9]/g, '');">
                </div>
                <span class="field-error" th:errors="*{phone}"></span>
            </div>

            <!-- 기본 주소 + 우편번호 + 카카오 주소찾기 버튼 -->
            <div class="form-group">
                <label class="form-label">배송지 주소 및 우편번호</label>
                <div class="zip-row">
                    <input type="text" id="zipcode" th:field="*{zipcode}" class="input-text zip-input" placeholder="우편번호 (5자리)" maxlength="5" readonly required>
                    <button type="button" class="btn-find-addr" onclick="openDaumPostcode()">주소 찾기</button>
                </div>
                <input type="text" id="address" th:field="*{address}" class="input-text" placeholder="기본 주소 (주소 찾기를 이용하세요)" style="margin-bottom: 6px;" readonly required>
                <input type="text" id="detailAddress" th:field="*{detailAddress}" class="input-text" placeholder="상세 주소 (동, 호수 등을 직접 입력하세요)">
                <span class="field-error" th:errors="*{address}"></span>
                <span class="field-error" th:errors="*{zipcode}"></span>
            </div>

            <button type="submit" class="btn-submit">
                수정 내용 저장하기
            </button>
            <a href="/mypage?tab=orders" class="btn-back-link">내 배송 목록으로 돌아가기</a>
        </form>
    </div>

    <script>
        function openDaumPostcode() {
            new daum.Postcode({
                oncomplete: function(data) {
                    var fullAddr = data.userSelectedType === 'R' ? data.roadAddress : data.jibunAddress;
                    document.getElementById('zipcode').value = data.zonecode;
                    document.getElementById('address').value = fullAddr;
                    document.getElementById('detailAddress').focus();
                }
            }).open();
        }

        document.addEventListener("DOMContentLoaded", function() {
            var fullPhone = document.getElementById("phone").value;
            if (fullPhone && fullPhone.includes("-")) {
                var parts = fullPhone.split("-");
                if (parts.length === 3) {
                    document.getElementById("phone1").value = parts[0];
                    document.getElementById("phone2").value = parts[1];
                    document.getElementById("phone3").value = parts[2];
                }
            }
        });

        function syncPhoneNumber() {
            var p1 = document.getElementById("phone1").value.trim();
            var p2 = document.getElementById("phone2").value.trim();
            var p3 = document.getElementById("phone3").value.trim();
            document.getElementById("phone").value = p1 + "-" + p2 + "-" + p3;
        }
    </script>
</body>
</html>
