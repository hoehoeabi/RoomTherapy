<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>굿즈 배송 신청 - Room Therapy</title>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-main: #0F172A;
            --text-sub: #64748B;
            --error: #EF4444;
            --error-bg: #FEF2F2;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px 16px;
        }
        .container {
            width: 100%;
            max-width: 520px;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 36px 32px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
        }
        .header {
            margin-bottom: 24px;
        }
        .badge {
            display: inline-block;
            background: #EEF2FF;
            color: var(--primary);
            font-weight: 700;
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 999px;
            margin-bottom: 12px;
        }
        h1 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }
        p.desc {
            color: var(--text-sub);
            font-size: 14px;
        }
        .info-box {
            background: #F1F5F9;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 24px;
        }
        .info-box strong {
            color: var(--text-main);
        }
        .alert-error {
            background: var(--error-bg);
            color: var(--error);
            border: 1px solid #FCA5A5;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 13px 15px;
            border-radius: 12px;
            border: 1px solid #CBD5E1;
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
        }
        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        .field-error {
            color: var(--error);
            font-size: 12px;
            margin-top: 5px;
            display: block;
        }
        /* 전화번호 3분할 레이아웃 */
        .phone-grid {
            display: grid;
            grid-template-columns: 80px 20px 1fr 20px 1fr;
            align-items: center;
            text-align: center;
        }
        .phone-separator {
            color: var(--text-sub);
            font-weight: 700;
        }
        /* 주소 & 우편번호 & 검색 버튼 그리드 레이아웃 */
        .address-top-grid {
            display: grid;
            grid-template-columns: 1fr 120px;
            gap: 10px;
            margin-bottom: 10px;
        }
        .btn-search-addr {
            background: #F1F5F9;
            color: var(--text-main);
            border: 1px solid #CBD5E1;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            padding: 0 12px;
            transition: all 0.2s;
        }
        .btn-search-addr:hover {
            background: #E2E8F0;
        }
    </style>
    <!-- 카카오 (Daum) 우편번호 서비스 공식 스크립트 (무료 / 키 불필요) -->
    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <span class="badge">STAGE REWARD</span>
            <h1>굿즈 배송 신청</h1>
            <p class="desc">유니티 게임에서 획득한 인증코드를 입력해 주세요.</p>
        </div>

        <div class="info-box">
            신청 계정: <strong th:text="${user != null ? user.nickname : '게스트'}">홍길동</strong>님
        </div>

        <!-- 에러 발생 시 알림 표시 -->
        <div class="alert-error" th:if="${errorMessage != null}" th:text="${errorMessage}">
            인증코드가 올바르지 않거나 이미 사용되었습니다.
        </div>

        <form th:action="@{/delivery}" th:object="${form}" method="post" id="deliveryForm" onsubmit="syncPhoneNumber()">
            <!-- 리워드 굿즈 선택 -->
            <div class="form-group" th:if="${goodsList != null and not #lists.isEmpty(goodsList)}">
                <label for="goodsId">신청할 리워드 굿즈 선택</label>
                <select id="goodsId" th:field="*{goodsId}" style="width: 100%; padding: 13px 15px; border-radius: 12px; border: 1px solid #CBD5E1; font-size: 15px; outline: none; background: #FFFFFF;">
                    <option value="">스테이지 기본 리워드 (선택 안 함)</option>
                    <option th:each="goods : ${goodsList}" 
                            th:value="${goods.id}" 
                            th:text="${goods.name + ' (남은 재고: ' + goods.stockQuantity + '개)'}"
                            th:selected="${form.goodsId != null and form.goodsId == goods.id}">
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label for="stageCode">클리어 인증코드</label>
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="stageCode" th:field="*{stageCode}" placeholder="인증코드를 입력하세요 (예: RT-A8F2K9Z 또는 사전 등록 코드)" style="flex: 1;" required>
                    <button type="button" class="btn-verify-code" onclick="verifyAuthCode()" style="background: #EEF2FF; color: #4F46E5; border: 1px solid #C7D2FE; padding: 0 16px; border-radius: 12px; font-weight: 700; font-size: 13px; cursor: pointer; white-space: nowrap; transition: all 0.2s;">🔍 코드 검증</button>
                </div>
                <div id="codeVerifyFeedback" style="display: none; margin-top: 8px; font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 8px;"></div>
                <span class="field-error" th:errors="*{stageCode}"></span>
            </div>

            <div class="form-group">
                <label for="recipientName">수령인 성함</label>
                <input type="text" id="recipientName" th:field="*{recipientName}" placeholder="받으실 분의 실명을 입력하세요" required>
                <span class="field-error" th:errors="*{recipientName}"></span>
            </div>

            <!-- 연락처: 010 - XXXX - XXXX 3분할 칸 및 자동 포커스 이동 -->
            <div class="form-group">
                <label>연락처 (휴대폰)</label>
                <input type="hidden" id="phone" th:field="*{phone}">
                <div class="phone-grid">
                    <input type="text" id="phone1" value="010" maxlength="3" style="text-align: center;" required>
                    <span class="phone-separator">-</span>
                    <input type="text" id="phone2" maxlength="4" placeholder="0000" style="text-align: center;" required 
                           oninput="this.value = this.value.replace(/[^0-9]/g, ''); if(this.value.length === 4) document.getElementById('phone3').focus();">
                    <span class="phone-separator">-</span>
                    <input type="text" id="phone3" maxlength="4" placeholder="0000" style="text-align: center;" required
                           oninput="this.value = this.value.replace(/[^0-9]/g, '');">
                </div>
                <span class="field-error" th:errors="*{phone}"></span>
            </div>

            <!-- 기본 주소 + 우편번호 + 카카오 주소찾기 버튼 -->
            <div class="form-group">
                <label>배송지 주소 및 우편번호</label>
                <div class="address-top-grid">
                    <input type="text" id="zipcode" th:field="*{zipcode}" placeholder="우편번호 (5자리)" maxlength="5" pattern="^\d{5}$" readonly required>
                    <button type="button" class="btn-search-addr" onclick="openDaumPostcode()">🔍 주소 찾기</button>
                </div>
                <input type="text" id="address" th:field="*{address}" placeholder="기본 주소 (주소 찾기를 이용하세요)" style="margin-bottom: 10px;" readonly required>
                <input type="text" id="detailAddress" th:field="*{detailAddress}" placeholder="상세 주소 (동, 호수 등을 직접 입력하세요)">
                <label style="display: flex; align-items: center; gap: 8px; font-weight: 500; font-size: 13px; margin-top: 12px; cursor: pointer; color: var(--text-sub);">
                    <input type="checkbox" id="saveAsDefaultAddress" th:field="*{saveAsDefaultAddress}" style="width: 16px; height: 16px; margin: 0; cursor: pointer;">
                    이 정보를 마이페이지 기본 배송지로 저장
                </label>
                <span class="field-error" th:errors="*{address}"></span>
                <span class="field-error" th:errors="*{zipcode}"></span>
            </div>

            <button type="submit" class="btn btn-primary">
                🎁 배송 신청 완료
            </button>
            <a href="/" class="btn btn-link">홈으로 돌아가기</a>
        </form>
    </div>

    <script>
        // 다음(카카오) 우편번호 팝업 호출 함수
        function openDaumPostcode() {
            new daum.Postcode({
                oncomplete: function(data) {
                    var fullAddr = data.userSelectedType === 'R' ? data.roadAddress : data.jibunAddress;
                    document.getElementById('zipcode').value = data.zonecode;
                    document.getElementById('address').value = fullAddr;
                    document.getElementById('detailAddress').focus();
                }
            }).open();
        }

        // 초기 로드 시 기존 phone 값이 있으면 분할 칸에 채워넣기
        document.addEventListener("DOMContentLoaded", function() {
            var fullPhone = document.getElementById("phone").value;
            if (fullPhone && fullPhone.includes("-")) {
                var parts = fullPhone.split("-");
                if (parts.length === 3) {
                    document.getElementById("phone1").value = parts[0];
                    document.getElementById("phone2").value = parts[1];
                    document.getElementById("phone3").value = parts[2];
                }
            }
        });

        // 폼 제출 전 3분할 칸의 전화번호를 '010-XXXX-XXXX' 형식으로 조합하여 hidden input에 저장
        function syncPhoneNumber() {
            var p1 = document.getElementById("phone1").value.trim();
            var p2 = document.getElementById("phone2").value.trim();
            var p3 = document.getElementById("phone3").value.trim();
            document.getElementById("phone").value = p1 + "-" + p2 + "-" + p3;
        }

        // 인증코드 실시간 비동기 검증
        async function verifyAuthCode() {
            const codeInput = document.getElementById('stageCode');
            const goodsSelect = document.getElementById('goodsId');
            const feedback = document.getElementById('codeVerifyFeedback');
            const code = codeInput.value.trim();
            const goodsId = goodsSelect ? goodsSelect.value : '';

            if (!code) {
                feedback.style.display = 'block';
                feedback.style.background = '#FEF2F2';
                feedback.style.color = '#EF4444';
                feedback.innerHTML = '❌ 인증코드를 입력해주세요.';
                codeInput.style.borderColor = '#EF4444';
                return;
            }

            feedback.style.display = 'block';
            feedback.style.background = '#F1F5F9';
            feedback.style.color = '#64748B';
            feedback.innerHTML = '⏳ 인증코드 유효성 검사 중...';

            try {
                let url = `/api/goods/verify-code?code=${encodeURIComponent(code)}`;
                if (goodsId) {
                    url += `&goodsId=${encodeURIComponent(goodsId)}`;
                }
                const res = await fetch(url);
                const result = await res.json();

                if (result.data && result.data.valid) {
                    feedback.style.background = '#ECFDF5';
                    feedback.style.color = '#059669';
                    const typeLabel = result.data.codeType === 'REDIS_DYNAMIC' ? ' (유니티 동적 난수 코드)' 
                                    : (result.data.codeType === 'DB_STATIC' ? ' (사전 등록 정적 코드)' : '');
                    feedback.innerHTML = `✅ ${result.data.message}${typeLabel}`;
                    codeInput.style.borderColor = '#10B981';
                } else {
                    feedback.style.background = '#FEF2F2';
                    feedback.style.color = '#EF4444';
                    feedback.innerHTML = `❌ ${result.data ? result.data.message : '유효하지 않은 인증코드입니다.'}`;
                    codeInput.style.borderColor = '#EF4444';
                }
            } catch (err) {
                feedback.style.background = '#FEF2F2';
                feedback.style.color = '#EF4444';
                feedback.innerHTML = '❌ 서버 검증 통신 중 오류가 발생했습니다.';
            }
        }
    </script>
</body>
</html>
