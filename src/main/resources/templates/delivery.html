<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>굿즈 배송 신청 - Room Therapy</title>
    <style>
        :root {
            --primary: #4F46E5;
            --bg: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-main: #0F172A;
            --text-sub: #64748B;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 36px 28px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
        .header {
            margin-bottom: 24px;
        }
        .badge {
            display: inline-block;
            background: #EEF2FF;
            color: var(--primary);
            font-weight: 700;
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 999px;
            margin-bottom: 12px;
        }
        h1 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 6px;
        }
        p.desc {
            color: var(--text-sub);
            font-size: 14px;
        }
        .info-box {
            background: #F1F5F9;
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 24px;
        }
        .info-box strong {
            color: var(--text-main);
        }
        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid #CBD5E1;
            font-size: 15px;
            outline: none;
            transition: border 0.2s;
        }
        input:focus {
            border-color: var(--primary);
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px 18px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            margin-top: 24px;
            text-align: center;
        }
        .btn-primary {
            background-color: var(--primary);
            color: #FFFFFF;
        }
        .btn-link {
            background: transparent;
            color: var(--text-sub);
            font-size: 14px;
            margin-top: 12px;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <span class="badge">STAGE REWARD</span>
            <h1>굿즈 배송 신청</h1>
            <p class="desc">유니티 게임에서 획득한 인증코드를 입력해 주세요.</p>
        </div>

        <div class="info-box">
            신청자: <strong th:text="${user != null ? user.nickname : '게스트'}">홍길동</strong>님
        </div>

        <form action="/delivery/apply" method="post">
            <div class="form-group">
                <label for="stageCode">클리어 인증코드</label>
                <input type="text" id="stageCode" name="stageCode" placeholder="예: ew-12345" required>
            </div>
            <div class="form-group">
                <label for="recipientName">수령인 성함</label>
                <input type="text" id="recipientName" name="recipientName" placeholder="받으실 분 성함" required>
            </div>
            <div class="form-group">
                <label for="phone">연락처</label>
                <input type="tel" id="phone" name="phone" placeholder="010-0000-0000" required>
            </div>
            <div class="form-group">
                <label for="address">배송지 주소</label>
                <input type="text" id="address" name="address" placeholder="기본 주소 및 상세 주소" required>
            </div>

            <button type="button" class="btn btn-primary" onclick="alert('인증코드 검증 및 배송 신청 API 연동 준비 중입니다!')">
                배송 신청 완료
            </button>
            <a href="/" class="btn btn-link">홈으로 돌아가기</a>
        </form>
    </div>
</body>
</html>
