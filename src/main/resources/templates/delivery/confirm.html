<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>배송 신청 완료 - 룸테라피</title>
    <style>
        :root {
            --red: #FF4B4E;
            --title: #020202;
            --text: #3C3C3C;
            --gray: #838383;
            --bg-light: #F7F8FA;
            --border-light: #EEEEEE;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #EFEFEF;
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .app-container {
            width: 100%;
            max-width: 390px;
            min-height: 100vh;
            background: #FFFFFF;
            padding: 36px 20px 40px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        @media (max-width: 440px) {
            body {
                background-color: #FFFFFF;
            }
            .app-container {
                box-shadow: none;
                min-height: 100dvh;
                padding: 28px 16px 36px;
            }
        }
        .check-circle {
            width: 48px;
            height: 48px;
            background: #FFEBEB;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
        }
        .check-circle svg {
            width: 24px;
            height: 24px;
            stroke: var(--red);
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }
        h1 {
            font-size: 19px;
            font-weight: 800;
            color: var(--title);
            letter-spacing: -0.4px;
            margin-bottom: 4px;
        }
        .congrats-sub {
            font-size: 11.5px;
            color: var(--gray);
            margin-bottom: 20px;
            letter-spacing: -0.2px;
        }
        /* 가로 슬라이더 */
        .thumb-slider {
            width: 100%;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            margin-bottom: 20px;
            padding-bottom: 4px;
            cursor: grab;
            user-select: none;
            scroll-behavior: smooth;
        }
        .thumb-slider.dragging {
            cursor: grabbing;
            scroll-snap-type: none;
        }
        .thumb-slider::-webkit-scrollbar {
            display: none;
        }
        .thumb-box {
            flex: 0 0 77px;
            width: 77px;
            height: 77px;
            border-radius: 8px;
            border: 1px solid var(--border-light);
            background: #FAFAFA;
            scroll-snap-align: start;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .thumb-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }
        .thumb-placeholder {
            font-size: 22px;
            color: #C0C0C0;
        }
        /* 상세 내역 카드 */
        .details-card {
            width: 100%;
            text-align: left;
            margin-bottom: 28px;
        }
        .goods-name-title {
            font-size: 14.5px;
            font-weight: 700;
            color: var(--title);
            margin-bottom: 12px;
            letter-spacing: -0.3px;
        }
        .info-table {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 11.5px;
        }
        .info-row {
            display: flex;
            align-items: flex-start;
        }
        .info-key {
            flex: 0 0 68px;
            color: var(--gray);
            font-weight: 500;
        }
        .info-value {
            flex: 1;
            color: var(--title);
            font-weight: 600;
            line-height: 1.4;
            word-break: break-all;
        }
        /* 액션 버튼 */
        .actions-wrap {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn-cta {
            width: 100%;
            height: 44px;
            background: var(--red);
            color: #FFFFFF;
            font-size: 13.5px;
            font-weight: 700;
            border-radius: 10px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(255, 75, 78, 0.28);
            transition: opacity 0.15s ease;
        }
        .btn-cta:active {
            opacity: 0.92;
        }
        .btn-outline {
            width: 100%;
            height: 42px;
            background: #FFFFFF;
            border: 1px solid var(--border-light);
            border-radius: 10px;
            color: var(--title);
            font-size: 13.5px;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-outline:active {
            background: #F8F9FA;
        }
        .link-home {
            font-size: 12px;
            color: var(--gray);
            text-decoration: none;
            margin-top: 6px;
        }
        .link-home:hover {
            color: var(--title);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 체크 아이콘 -->
        <div class="check-circle">
            <svg viewBox="0 0 24 24">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </div>

        <h1>배송 신청이 완료되었습니다!</h1>
        <p class="congrats-sub">룸테라피 스테이지 클리어를 축하해요!</p>

        <!-- 리워드 가로 썸네일 슬라이더 (해당 굿즈의 실제 이미지들 연동) -->
        <div class="thumb-slider">
            <th:block th:if="${order.goodsImageList != null and !order.goodsImageList.empty}">
                <div th:each="imgUrl : ${order.goodsImageList}" class="thumb-box">
                    <img th:src="${imgUrl}" th:alt="${order.goodsName}">
                </div>
            </th:block>
            <th:block th:if="${order.goodsImageList == null or order.goodsImageList.empty}">
                <div class="thumb-box">
                    <span class="thumb-placeholder">🎁</span>
                </div>
            </th:block>
        </div>

        <!-- 신청 내역 상세 -->
        <div class="details-card" th:object="${order}">
            <div class="goods-name-title" th:text="${order.goodsName}">룸테라피 아늑한 무드등 (스테이지 1 리워드)</div>
            <div class="info-table">
                <div class="info-row">
                    <span class="info-key">수령인</span>
                    <span class="info-value" th:text="${order.recipientName}">에이치</span>
                </div>
                <div class="info-row">
                    <span class="info-key">배송 주소</span>
                    <span class="info-value" th:text="${'(' + order.zipcode + ') ' + order.address + ' ' + (order.detailAddress != null ? order.detailAddress : '')}">(13479) 경기 성남시 분당구 서판교로 32 301동 302호</span>
                </div>
                <div class="info-row">
                    <span class="info-key">신청 일시</span>
                    <span class="info-value" th:text="${#temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm')}">2026-10-22 18:05</span>
                </div>
                <div class="info-row" th:if="${order.feedback != null and !order.feedback.isEmpty()}">
                    <span class="info-key">피드백</span>
                    <span class="info-value" th:text="${order.feedback}">물건들이 너무 작아요</span>
                </div>
            </div>
        </div>

        <!-- 하단 액션 버튼들 -->
        <div class="actions-wrap">
            <a href="/mypage?tab=orders" class="btn-cta">
                내 배송 신청 내역 확인 &nbsp;|&nbsp; 배송지 변경
            </a>
            <a href="/goods" class="btn-outline">
                굿즈 리워드 둘러보기
            </a>
            <a href="/" class="link-home">
                홈으로 이동
            </a>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const slider = document.querySelector('.thumb-slider');
            if (slider) {
                let isDown = false;
                let startX, scrollLeft;
                slider.addEventListener('mousedown', (e) => {
                    isDown = true;
                    slider.classList.add('dragging');
                    startX = e.pageX - slider.offsetLeft;
                    scrollLeft = slider.scrollLeft;
                });
                slider.addEventListener('mouseleave', () => {
                    isDown = false;
                    slider.classList.remove('dragging');
                });
                slider.addEventListener('mouseup', () => {
                    isDown = false;
                    slider.classList.remove('dragging');
                });
                slider.addEventListener('mousemove', (e) => {
                    if (!isDown) return;
                    e.preventDefault();
                    const x = e.pageX - slider.offsetLeft;
                    const walk = (x - startX) * 1.5;
                    slider.scrollLeft = scrollLeft - walk;
                });
            }
        });
    </script>
</body>
</html>
