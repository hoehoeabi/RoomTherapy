<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Room Therapy - 룸테라피</title>
    <link rel="stylesheet" href="/css/variables.css">
    <style>
        :root {
            --red: #FF4B4E;
            --title: #020202;
            --text: #3C3C3C;
            --gray: #838383;
            --bg-light: #F7F8FA;
            --border-light: #EEEEEE;
            --card-radius: 16px;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #EFEFEF;
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .app-container {
            width: 100%;
            max-width: 390px;
            min-height: 100vh;
            background: #FFFFFF;
            padding: 36px 20px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            position: relative;
        }
        @media (max-width: 440px) {
            body {
                background-color: #FFFFFF;
            }
            .app-container {
                box-shadow: none;
                min-height: 100dvh;
                padding: 28px 18px 36px;
            }
        }
        .brand-badge {
            display: inline-block;
            background: #FFEBEB;
            color: var(--red);
            font-weight: 700;
            font-size: 11px;
            letter-spacing: 0.5px;
            padding: 4px 14px;
            border-radius: 9999px;
            margin-bottom: 14px;
        }
        .logo-wrap {
            width: 202px;
            height: auto;
            margin-bottom: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .logo-wrap img {
            width: 100%;
            height: auto;
            object-fit: contain;
        }
        .main-sub {
            color: var(--gray);
            font-size: 12px;
            font-weight: 500;
            letter-spacing: -0.3px;
            margin-bottom: 24px;
            text-align: center;
        }
        .user-card {
            width: 100%;
            background: var(--bg-light);
            border-radius: 14px;
            padding: 16px 18px;
            margin-bottom: 16px;
            text-align: left;
        }
        .user-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .user-card-label {
            font-size: 11px;
            color: var(--gray);
            font-weight: 500;
        }
        .badge-roommate {
            background: #FFEBEB;
            color: var(--red);
            font-size: 10.5px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 9999px;
        }
        .badge-admin {
            background: #EEF2FF;
            color: #4F46E5;
            font-size: 10.5px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 9999px;
        }
        .user-name {
            font-size: 18px;
            font-weight: 700;
            color: var(--title);
            margin-bottom: 4px;
            letter-spacing: -0.4px;
        }
        .user-status-text {
            font-size: 11px;
            color: var(--gray);
            letter-spacing: -0.2px;
        }
        .actions-wrap {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn-card {
            width: 100%;
            height: 42px;
            background: #FFFFFF;
            border: 1px solid var(--border-light);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-decoration: none;
            color: var(--title);
            font-size: 13.5px;
            font-weight: 600;
            transition: background 0.15s ease, border-color 0.15s ease;
        }
        .btn-card:active {
            background: #F8F9FA;
        }
        .btn-card-sub {
            font-size: 12px;
            color: var(--gray);
            font-weight: 400;
        }
        .btn-cta {
            width: 100%;
            height: 44px;
            background: var(--red);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            color: #FFFFFF;
            font-size: 14px;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(255, 75, 78, 0.28);
            transition: opacity 0.15s ease, transform 0.1s ease;
        }
        .btn-cta:active {
            opacity: 0.92;
            transform: scale(0.99);
        }
        .btn-cta-icon {
            width: 18px;
            height: 18px;
            object-fit: contain;
        }
        .logout-form {
            width: 100%;
            margin-top: 14px;
            text-align: center;
        }
        .btn-logout {
            background: none;
            border: none;
            color: var(--gray);
            font-size: 12px;
            cursor: pointer;
            text-decoration: none;
            padding: 8px;
        }
        .btn-logout:hover {
            color: var(--text);
        }
        .btn-kakao {
            width: 100%;
            height: 44px;
            background: #FEE500;
            color: #191919;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            margin-bottom: 10px;
        }
        .btn-game {
            width: 100%;
            height: 44px;
            background: #1E293B;
            color: #FFFFFF;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(30, 41, 59, 0.18);
            transition: opacity 0.15s ease, transform 0.1s ease;
            margin-bottom: 10px;
        }
        .btn-game:active {
            opacity: 0.92;
            transform: scale(0.99);
        }
        .admin-link {
            font-size: 12px;
            color: #4F46E5;
            text-decoration: none;
            margin-top: 6px;
            font-weight: 600;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 상단 룸테라피 뱃지 -->
        <span class="brand-badge">ROOM THERAPY</span>

        <!-- 중앙 대표 로고 -->
        <div class="logo-wrap">
            <img src="/images/RoomTherapy_logo.png" alt="Room Therapy Logo">
        </div>
        <p class="main-sub">정리가 선물이 되는 나만의 감성 공간 테라피</p>

        <!-- 비로그인 상태 -->
        <div th:if="${user == null}" style="width: 100%;">
            <a href="https://link.inpock.co.kr/roomtheraphy" target="_blank" rel="noopener noreferrer" class="btn-game">
                <img src="/images/coin_logo.png" alt="게임" class="btn-cta-icon">
                <span>방정리 게임하러 가기</span>
            </a>

            <a href="/oauth2/authorization/kakao" class="btn-kakao">
                <svg width="17" height="17" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M9 1.5C4.858 1.5 1.5 4.134 1.5 7.387c0 2.05 1.365 3.848 3.447 4.887l-.74 2.766a.375.375 0 00.56.402l3.356-2.222c.287.037.58.056.877.056 4.142 0 7.5-2.634 7.5-5.889C16.5 4.134 13.142 1.5 9 1.5z" fill="#000000"/>
                </svg>
                <span>카카오로 시작하기</span>
            </a>

            <a href="/goods" class="btn-card">
                <span>굿즈 리워드 둘러보기</span>
            </a>

            <!-- 개발/테스트용 빠른 로그인 (비운영 환경) -->
            <div th:if="${@profileUtil.isDev()}" style="margin-top: 24px; padding: 14px; background: #F8FAFC; border: 1px dashed #CBD5E1; border-radius: 12px; font-size: 12px;">
                <div style="font-weight: 700; color: var(--gray); margin-bottom: 8px; text-align: center;">⚡ 빠른 테스트 계정 로그인</div>
                <div style="display: flex; flex-direction: column; gap: 6px;">
                    <a href="/test/login?role=USER" class="btn-card" style="height: 36px; font-size: 12px;">
                        <span>👤 룸메이트 (일반 유저)</span>
                    </a>
                    <a href="/test/login?role=ADMIN" class="btn-card" style="height: 36px; font-size: 12px; color: #4F46E5;">
                        <span>👑 관리자 (운영자)</span>
                    </a>
                </div>
            </div>
        </div>

        <!-- 로그인 상태 -->
        <div th:if="${user != null}" style="width: 100%;">
            <!-- 유저 프로필 카드 -->
            <div class="user-card">
                <div class="user-card-header">
                    <span class="user-card-label">로그인 계정</span>
                    <span th:if="${user.authorities != null and user.authorities.?[authority == 'ROLE_ADMIN'].size() > 0}" class="badge-admin">관리자</span>
                    <span th:if="${user.authorities == null or user.authorities.?[authority == 'ROLE_ADMIN'].size() == 0}" class="badge-roommate">룸메이트</span>
                </div>
                <div class="user-name" th:text="${user.nickname}">송혜정</div>
                <div class="user-status-text" th:text="${recentOrderSummary != null ? recentOrderSummary : (user.email != null ? user.email : '연동 완료')}">
                    2026-10-22 18:05 주문 건 현재 접수 완료
                </div>
            </div>

            <!-- 네비게이션 액션 버튼 -->
            <div class="actions-wrap">
                <a href="https://link.inpock.co.kr/roomtheraphy" target="_blank" rel="noopener noreferrer" class="btn-game" style="margin-bottom: 0;">
                    <img src="/images/coin_logo.png" alt="게임" class="btn-cta-icon">
                    <span>방정리 게임하러 가기</span>
                </a>

                <a href="/mypage" class="btn-card">
                    <span>마이페이지</span>
                    <span class="btn-card-sub">프로필 &nbsp;|&nbsp; 배송지 &nbsp;|&nbsp; 신청내역</span>
                </a>

                <a href="/goods" class="btn-card">
                    <span>굿즈 리워드 둘러보기</span>
                </a>

                <a href="/delivery" class="btn-cta">
                    <img src="/images/coin_logo.png" alt="코인" class="btn-cta-icon">
                    <span>굿즈 배송 신청하러 가기</span>
                </a>

                <!-- 관리자 전용 바로가기 -->
                <a th:if="${user.authorities != null and user.authorities.?[authority == 'ROLE_ADMIN'].size() > 0}" 
                   href="/admin/deliveries" class="admin-link">
                    👑 관리자 전체 배송 내역 관리
                </a>
            </div>

            <!-- 하단 로그아웃 링크 -->
            <form action="/logout" method="post" class="logout-form">
                <button type="submit" class="btn-logout">로그아웃</button>
            </form>
        </div>
    </div>
</body>
</html>
