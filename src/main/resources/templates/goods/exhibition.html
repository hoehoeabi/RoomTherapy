<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title th:text="${goods.name} + ' - 3D 오브제 전시관 | 룸테라피'">3D 오브제 전시관 - 룸테라피</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <!-- Three.js ESM Import Map (.glb, .gltf, .fbx, .obj, .usdz 로더 지원) -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background: #F7F7F7;
            color: #1F1F1F;
            overflow-x: hidden;
        }

        .spatial-room {
            position: relative;
            width: 100%;
            max-width: 560px;
            min-height: 100vh;
            margin: 0 auto;
            padding: max(22px, env(safe-area-inset-top)) 20px 48px;
        }

        /* 상단 바 */
        .exh-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 26px;
        }
        .btn-back {
            font-size: 12.5px;
            font-weight: 600;
            color: #6B6B6B;
            text-decoration: none;
            background: none;
            border: none;
            cursor: pointer;
        }
        .btn-back:hover { color: #1F1F1F; }
        .btn-manage-objects {
            font-size: 12px;
            font-weight: 700;
            color: #FF4B4E;
            text-decoration: none;
            background: #FFEBEB;
            padding: 6px 12px;
            border-radius: 999px;
        }

        .flash-banner {
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 12.5px;
            font-weight: 600;
            margin-bottom: 14px;
        }
        .flash-banner.success { background: #EBFBEE; color: #2B8A3E; }
        .flash-banner.error { background: #FFEAEA; color: #DC2626; }

        .gallery-intro-title {
            font-size: 24px;
            line-height: 1.3;
            font-weight: 800;
            color: #111;
            letter-spacing: -0.8px;
            margin-bottom: 8px;
            word-break: keep-all;
        }
        .gallery-intro-desc {
            font-size: 12.5px;
            color: #7A7A7A;
            font-weight: 500;
            margin-bottom: 26px;
            letter-spacing: -0.2px;
        }

        /* 3열 오브제 카드 그리드 */
        .gallery-wall-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            transform: none !important;
        }
        .gallery-frame-card {
            position: relative;
            aspect-ratio: 1 / 1;
            background: #FFFFFF;
            border-radius: 16px;
            cursor: pointer;
            overflow: hidden;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .gallery-frame-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.07);
        }
        .gallery-frame-mat { width: 100%; height: 100%; position: relative; }
        .frame-index-tag {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 2;
            background: #FFEBEB;
            color: #FF4B4E;
            font-size: 11px;
            font-weight: 800;
            padding: 3px 9px;
            border-radius: 999px;
        }
        .frame-thumb-canvas-wrap {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px;
        }
        .frame-thumb-img {
            display: none;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .frame-thumb-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            text-align: center;
            color: #B0B0B0;
        }
        .frame-cube-icon { font-size: 22px; opacity: 0.6; }
        .frame-loading-text {
            font-size: 10px;
            font-weight: 600;
            color: #A8A8A8;
            line-height: 1.3;
            word-break: keep-all;
        }

        /* 빈 전시관 */
        .empty-exhibition-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 56px 0 40px;
        }
        .empty-monkey {
            width: 190px;
            height: auto;
            margin-bottom: 18px;
        }
        .empty-exhibition-title {
            font-size: 15px;
            font-weight: 800;
            color: #BDBDBD;
            line-height: 1.5;
            letter-spacing: -0.3px;
            margin-bottom: 18px;
        }

        /* 상세 뷰어 (라이트 풀스크린) */
        .spatial-detail-overlay {
            position: fixed;
            inset: 0;
            background: #F7F7F7;
            overflow-y: auto;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.22s ease, visibility 0.22s ease;
            z-index: 1500;
        }
        .spatial-detail-overlay.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }
        .spatial-detail-layout {
            width: 100%;
            max-width: 560px;
            margin: 0 auto;
            padding: max(22px, env(safe-area-inset-top)) 20px 40px;
        }
        .detail-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }
        .detail-topbar-left, .detail-topbar-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .btn-spatial-nav {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 12.5px;
            font-weight: 700;
            color: #6B6B6B;
        }
        .btn-spatial-nav.next { color: #FF4B4E; }

        .spatial-stage-panel {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1.05;
            background: radial-gradient(circle at 50% 45%, #FFFFFF 0%, #F3F3F3 100%);
            border: 2px solid #D9D9D9;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
        }
        #threeCanvasContainer {
            width: 100%;
            height: 100%;
            cursor: grab;
            touch-action: none;
        }
        #threeCanvasContainer:active { cursor: grabbing; }

        .model-loading-state {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.82);
            z-index: 5;
            padding: 20px;
            text-align: center;
            transition: opacity 0.2s ease;
        }
        .model-loading-state.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .model-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #E3E3E3;
            border-top-color: #FF4B4E;
            border-radius: 50%;
            animation: spin3d 0.85s linear infinite;
        }
        @keyframes spin3d { to { transform: rotate(360deg); } }
        .model-loading-label { font-size: 13px; font-weight: 700; color: #333; }
        .model-loading-sub { font-size: 11.5px; font-weight: 500; color: #8A8A8A; }
        .model-progress-track {
            width: min(220px, 75%);
            height: 6px;
            border-radius: 999px;
            background: #E6E6E6;
            overflow: hidden;
        }
        .model-progress-fill {
            width: 0%;
            height: 100%;
            border-radius: 999px;
            background: #FF4B4E;
            transition: width 0.15s ease;
        }
        .btn-model-retry {
            display: none;
            margin-top: 4px;
            padding: 7px 16px;
            border-radius: 999px;
            border: 1px solid #DDD;
            background: #FFF;
            color: #333;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .stage-zoom-controls {
            position: absolute;
            right: 16px;
            bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
        }
        .btn-stage-ctrl {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #FFFFFF;
            border: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
            color: #555;
            font-size: 20px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .btn-ar-quicklook {
            position: absolute;
            left: 16px;
            bottom: 16px;
            height: 34px;
            padding: 0 14px;
            border-radius: 999px;
            background: #FFFFFF;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
            color: #333;
            font-size: 11.5px;
            font-weight: 700;
            text-decoration: none;
            display: none;
            align-items: center;
            z-index: 10;
        }

        .spatial-info-panel {
            margin-top: 14px;
            background: #FFFFFF;
            border: 1px solid #E6E6E6;
            border-radius: 24px;
            padding: 26px 24px 20px;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .info-top-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .info-artwork-label {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.6px;
            color: #7A7A7A;
        }
        .info-format-badge {
            font-size: 10px;
            font-weight: 800;
            color: #8A8A8A;
            background: #F1F1F1;
            padding: 2px 8px;
            border-radius: 999px;
        }
        .info-object-title {
            font-size: 24px;
            font-weight: 800;
            color: #111;
            letter-spacing: -0.6px;
            line-height: 1.3;
            margin-bottom: 14px;
            word-break: keep-all;
        }
        .info-object-desc {
            font-size: 14px;
            line-height: 1.65;
            color: #7D7D7D;
            font-weight: 500;
            white-space: pre-line;
            word-break: keep-all;
        }
        .info-bottom-area {
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .info-seller-actions { display: flex; gap: 8px; }
        .btn-detail-edit, .btn-detail-delete {
            flex: 1;
            height: 34px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
        }
        .btn-detail-edit {
            background: #F3F3F3;
            border: 1px solid #E3E3E3;
            color: #333;
        }
        .btn-detail-delete {
            background: #FFEAEA;
            border: 1px solid #FFD2D2;
            color: #DC3545;
        }
        .info-rotate-hint {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12.5px;
            font-weight: 600;
            color: #7A7A7A;
        }

        @media (max-width: 420px) {
            .gallery-intro-title { font-size: 21px; }
            .gallery-wall-grid { gap: 8px; }
            .info-object-title { font-size: 21px; }
        }
    </style>
</head>
<body>
    <main class="spatial-room" id="spatialRoom">
        <div class="exh-topbar">
            <a href="/goods" class="btn-back">&lt; 돌아가기</a>
            <!-- 판매자/관리자 전용 수정 버튼 -->
            <a th:if="${canManage}"
               th:href="@{'/seller/goods/' + ${goods.id} + '/edit#section-3d-objects'}"
               class="btn-manage-objects">오브제 수정</a>
        </div>

        <div class="flash-banner success" th:if="${successMessage != null}" th:text="${successMessage}"></div>
        <div class="flash-banner error" th:if="${errorMessage != null}" th:text="${errorMessage}"></div>

        <h1 class="gallery-intro-title" th:text="${goods.name} + ' 스테이지 오브제 전시관'">스테이지 오브제 전시관</h1>
        <p class="gallery-intro-desc">그림을 누르면 전시된 3D 오브제와 설명을 확인할 수 있어요.</p>

        <!-- 등록된 3D 오브제가 없는 경우 -->
        <div class="empty-exhibition-box" th:if="${objects3d == null or objects3d.empty}">
            <img class="empty-monkey" src="/images/monkey_light_color.png" alt="">
            <h2 class="empty-exhibition-title">앗! 아직 전시된 오브제가 없어요.<br>곧 새로운 오브제로 찾아올게요!</h2>
            <a th:if="${canManage}"
               th:href="@{'/seller/goods/' + ${goods.id} + '/edit#section-3d-objects'}"
               class="btn-manage-objects">+ 3D 오브제 등록하러 가기</a>
        </div>

        <!-- 오브제 그리드 -->
        <div th:if="${objects3d != null and !objects3d.empty}">
            <div class="gallery-wall-grid" id="galleryWallGrid">
                <div class="gallery-frame-card"
                     th:each="obj, stat : ${objects3d}"
                     th:data-index="${stat.index}"
                     onclick="openSpatialViewer(Number(this.getAttribute('data-index')))">
                    <div class="gallery-frame-mat">
                        <span class="frame-index-tag" th:text="${#numbers.formatInteger(stat.count, 2)}">01</span>
                        <div class="frame-thumb-canvas-wrap">
                            <img class="frame-thumb-img"
                                 th:id="'frameThumbImg-' + ${stat.index}"
                                 th:src="${obj.thumbnailUrl != null and !obj.thumbnailUrl.isBlank() ? obj.thumbnailUrl : ''}"
                                 th:style="${obj.thumbnailUrl != null and !obj.thumbnailUrl.isBlank() ? 'display:block;' : 'display:none;'}"
                                 th:alt="${obj.name}">
                            <div class="frame-thumb-placeholder"
                                 th:id="'frameThumbPlaceholder-' + ${stat.index}"
                                 th:style="${obj.thumbnailUrl != null and !obj.thumbnailUrl.isBlank() ? 'display:none;' : 'display:flex;'}">
                                <span class="frame-cube-icon" style="font-size: 26px; opacity: 0.25;">🏛️</span>
                                <span class="frame-loading-text" th:text="${obj.name != null and !obj.name.isBlank() ? obj.name : '3D 오브제'}">3D 오브제</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 3D 오브제 상세 뷰어 -->
    <div id="spatialDetailOverlay" class="spatial-detail-overlay" aria-hidden="true">
        <div class="spatial-detail-layout">
            <div class="detail-topbar">
                <div class="detail-topbar-left">
                    <button type="button" class="btn-back" onclick="closeSpatialViewer()">&lt; 돌아가기</button>
                    <button type="button" id="btnPrevObj" class="btn-spatial-nav prev" onclick="stepSpatialObject(-1)">이전 오브제</button>
                </div>
                <div class="detail-topbar-right">
                    <button type="button" id="btnNextObj" class="btn-spatial-nav next" onclick="stepSpatialObject(1)">다음 오브제 보기</button>
                </div>
            </div>

            <section class="spatial-stage-panel">
                <div id="modelLoadingState" class="model-loading-state">
                    <div id="modelSpinner" class="model-spinner"></div>
                    <div class="model-loading-label" id="modelLoadingText">3D 모델을 불러오는 중입니다...</div>
                    <div class="model-loading-sub" id="modelLoadingSub">잠시만 기다려주세요</div>
                    <div id="modelProgressTrack" class="model-progress-track">
                        <div id="modelProgressFill" class="model-progress-fill"></div>
                    </div>
                    <button type="button" id="btnModelRetry" class="btn-model-retry" onclick="retryCurrentStageObject()">↻ 다시 불러오기</button>
                </div>

                <div id="threeCanvasContainer"></div>

                <a id="arQuickLookLink" rel="ar" href="#" class="btn-ar-quicklook">🥽 AR 공간 보기</a>

                <div class="stage-zoom-controls">
                    <button type="button" class="btn-stage-ctrl" onclick="zoomStageCamera(-0.22)" title="확대">+</button>
                    <button type="button" class="btn-stage-ctrl" onclick="zoomStageCamera(0.22)" title="축소">&minus;</button>
                </div>
            </section>

            <aside class="spatial-info-panel">
                <div>
                    <div class="info-top-meta">
                        <span class="info-artwork-label" id="detailObjOrder">ARTWORK 01</span>
                        <span class="info-format-badge" id="detailObjFormat">GLB</span>
                    </div>
                    <h2 class="info-object-title" id="detailObjName">오브제 이름</h2>
                    <p class="info-object-desc" id="detailObjDesc">오브제 설명</p>
                </div>

                <div class="info-bottom-area">
                    <!-- 판매자/관리자 전용 -->
                    <div class="info-seller-actions" th:if="${canManage}">
                        <a th:href="@{'/seller/goods/' + ${goods.id} + '/edit#section-3d-objects'}" class="btn-detail-edit">수정/추가</a>
                        <form id="singleObjectDeleteForm" method="post" style="flex:1;display:flex;" onsubmit="return confirm('이 3D 오브제를 전시관에서 삭제하시겠습니까?');">
                            <input type="hidden" name="redirect" th:value="'/goods/' + ${goods.id} + '/exhibition'">
                            <button type="submit" class="btn-detail-delete" style="width:100%;">삭제</button>
                        </form>
                    </div>
                    <div class="info-rotate-hint">
                        <span>↻</span>
                        <span>Drag to rotate model</span>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <!-- 서버 데이터를 JS에 주입 -->
    <script th:inline="javascript">
        /*<![CDATA[*/
        window.EXHIBITION_GOODS_ID = /*[[${goods.id}]]*/ 0;
        window.EXHIBITION_OBJECTS = /*[[${objects3d}]]*/ [];
        /*]]>*/
    </script>

    <!-- Three.js 멀티 포맷(.glb, .gltf, .fbx, .obj, .usdz) 3D 뷰어 및 썸네일 스냅샷 엔진 -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
        import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
        import { USDZLoader } from 'three/addons/loaders/USDZLoader.js';

        const objects = Array.isArray(window.EXHIBITION_OBJECTS) ? window.EXHIBITION_OBJECTS : [];
        const goodsId = window.EXHIBITION_GOODS_ID;

        // 로더 인스턴스 구성
        const gltfLoader = new GLTFLoader();
        gltfLoader.setCrossOrigin('anonymous');
        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/');
        gltfLoader.setDRACOLoader(dracoLoader);

        const fbxLoader = new FBXLoader();
        fbxLoader.setCrossOrigin('anonymous');
        const objLoader = new OBJLoader();
        objLoader.setCrossOrigin('anonymous');
        const usdzLoader = new USDZLoader();

        function getExtension(url) {
            if (!url) return '';
            const clean = url.split('?')[0].trim().toLowerCase();
            const idx = clean.lastIndexOf('.');
            return idx >= 0 ? clean.substring(idx) : '';
        }

        // 외부 S3 URL(Cross-Origin)인 경우 브라우저 CORS 차단을 우회하기 위해 백엔드 동일 출처(Same-Origin) 스트리밍 엔드포인트로 변환
        function resolveSameOriginModelUrl(item) {
            if (!item || !item.modelUrl) return '';
            const rawUrl = item.modelUrl.trim();
            const ext = getExtension(rawUrl) || '.glb';
            if ((rawUrl.startsWith('http://') || rawUrl.startsWith('https://')) && item.id != null && goodsId) {
                return `/goods/${goodsId}/objects/${item.id}/model/object${ext}`;
            }
            return rawUrl;
        }

        // 인메모리 3D 모델 템플릿 캐시 및 진행 중인 다운로드 요청 통합(Deduplication)
        const modelTemplateCache = new Map(); // key -> THREE.Group (normalized template)
        const inflightLoads = new Map();      // key -> { promise: Promise<THREE.Group>, listeners: Set<Function> }

        function getModelCacheKey(item) {
            if (!item) return '';
            return item.id != null ? `id:${item.id}:${item.modelUrl || ''}` : `url:${item.modelUrl || ''}`;
        }

        function normalizeRaw3dRoot(rawRoot) {
            const pivot = new THREE.Group();
            rawRoot.traverse((child) => {
                if (child.isMesh) {
                    if (!child.material) {
                        child.material = new THREE.MeshStandardMaterial({
                            color: 0xd8dee9,
                            roughness: 0.45,
                            metalness: 0.1
                        });
                    }
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });

            const box = new THREE.Box3().setFromObject(rawRoot);
            const size = new THREE.Vector3();
            const center = new THREE.Vector3();
            box.getSize(size);
            box.getCenter(center);

            const maxDim = Math.max(size.x, size.y, size.z);
            const targetSpan = 2.2;
            const scale = maxDim > 0.0001 ? (targetSpan / maxDim) : 1;

            rawRoot.scale.multiplyScalar(scale);

            const scaledBox = new THREE.Box3().setFromObject(rawRoot);
            const scaledCenter = new THREE.Vector3();
            scaledBox.getCenter(scaledCenter);
            rawRoot.position.sub(scaledCenter);

            pivot.add(rawRoot);
            return pivot;
        }

        function loadFromSingleUrl(targetUrl, ext, onProgress) {
            return new Promise((resolve, reject) => {
                const handleLoaded = (rawRoot) => {
                    try {
                        resolve(normalizeRaw3dRoot(rawRoot));
                    } catch (err) {
                        reject(err);
                    }
                };

                if (ext === '.glb' || ext === '.gltf') {
                    gltfLoader.load(targetUrl, (gltf) => handleLoaded(gltf.scene || gltf.scenes[0]), onProgress, reject);
                } else if (ext === '.fbx') {
                    fbxLoader.load(targetUrl, (group) => handleLoaded(group), onProgress, reject);
                } else if (ext === '.obj') {
                    objLoader.load(targetUrl, (group) => handleLoaded(group), onProgress, reject);
                } else if (ext === '.usdz') {
                    usdzLoader.load(targetUrl, (group) => handleLoaded(group), onProgress, reject);
                } else {
                    gltfLoader.load(targetUrl, (gltf) => handleLoaded(gltf.scene || gltf.scenes[0]), onProgress, reject);
                }
            });
        }

        // 캐시 및 중복 다운로드 방지(In-Flight Deduplication)가 적용된 3D 모델 로더
        async function loadNormalized3dModel(item, onProgressCallback) {
            const cacheKey = getModelCacheKey(item);
            if (modelTemplateCache.has(cacheKey)) {
                return modelTemplateCache.get(cacheKey).clone(true);
            }

            if (inflightLoads.has(cacheKey)) {
                const entry = inflightLoads.get(cacheKey);
                if (typeof onProgressCallback === 'function') {
                    entry.listeners.add(onProgressCallback);
                }
                const templatePivot = await entry.promise;
                return templatePivot.clone(true);
            }

            const listeners = new Set();
            if (typeof onProgressCallback === 'function') {
                listeners.add(onProgressCallback);
            }

            const notifyProgress = (xhrEvt) => {
                listeners.forEach((fn) => {
                    try {
                        fn(xhrEvt);
                    } catch (ignore) {}
                });
            };

            const primaryUrl = resolveSameOriginModelUrl(item);
            const fallbackUrl = item.modelUrl ? item.modelUrl.trim() : '';
            const ext = getExtension(fallbackUrl || primaryUrl);

            const loadPromise = (async () => {
                try {
                    const pivot = await loadFromSingleUrl(primaryUrl, ext, notifyProgress);
                    modelTemplateCache.set(cacheKey, pivot);
                    return pivot;
                } catch (primaryErr) {
                    if (fallbackUrl && fallbackUrl !== primaryUrl) {
                        const pivot = await loadFromSingleUrl(fallbackUrl, ext, notifyProgress);
                        modelTemplateCache.set(cacheKey, pivot);
                        return pivot;
                    }
                    throw primaryErr;
                } finally {
                    inflightLoads.delete(cacheKey);
                }
            })();

            inflightLoads.set(cacheKey, { promise: loadPromise, listeners });
            const resolvedTemplate = await loadPromise;
            return resolvedTemplate.clone(true);
        }

        // =========================================================
        // 1. 갤러리 액자 마우스 패럴랙스 틸트 및 3D 썸네일 자동 스냅샷 생성
        // =========================================================
        const wallGrid = document.getElementById('galleryWallGrid');
        const roomEl = document.getElementById('spatialRoom');
        if (wallGrid && roomEl) {
            roomEl.addEventListener('mousemove', (e) => {
                if (window.innerWidth <= 860) return;
                const rect = roomEl.getBoundingClientRect();
                const nx = ((e.clientX - rect.left) / rect.width - 0.5) * 2;
                const ny = ((e.clientY - rect.top) / rect.height - 0.5) * 2;
                const rotY = -8 + nx * 6;
                const rotX = 2 - ny * 4;
                wallGrid.style.transform = `rotateY(${rotY.toFixed(2)}deg) rotateX(${rotX.toFixed(2)}deg)`;
            });
        }

        // 썸네일 이미지 로드 실패 시 대체 플레이스홀더 처리
        function setupThumbnailFallbacks() {
            if (!objects || objects.length === 0) return;
            for (let i = 0; i < objects.length; i++) {
                const imgEl = document.getElementById(`frameThumbImg-${i}`);
                const phEl = document.getElementById(`frameThumbPlaceholder-${i}`);
                if (imgEl && phEl) {
                    imgEl.addEventListener('error', () => {
                        imgEl.style.display = 'none';
                        phEl.style.display = 'flex';
                    });
                }
            }
        }

        setupThumbnailFallbacks();

        // =========================================================
        // 2. 스페이셜 상세 3D 뷰어 (Three.js + OrbitControls)
        // =========================================================
        let currentIndex = 0;
        let renderer = null;
        let scene = null;
        let camera = null;
        let controls = null;
        let activeModel = null;
        let animFrameId = null;
        let loadSeq = 0;

        function ensureThreeViewerInitialized() {
            const container = document.getElementById('threeCanvasContainer');
            if (!container) return;
            if (renderer) {
                resizeThreeViewer();
                return;
            }

            scene = new THREE.Scene();

            const w = container.clientWidth || 640;
            const h = container.clientHeight || 480;
            camera = new THREE.PerspectiveCamera(40, w / h, 0.1, 100);
            camera.position.set(0, 1.0, 3.8);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(w, h);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.15;

            container.innerHTML = '';
            container.appendChild(renderer.domElement);

            // 스튜디오 3점 조명
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.25);
            const hemiLight = new THREE.HemisphereLight(0xf8fafc, 0x1e293b, 1.0);
            const keyLight = new THREE.DirectionalLight(0xffffff, 2.0);
            keyLight.position.set(4, 6, 5);
            const fillLight = new THREE.DirectionalLight(0x93c5fd, 0.85);
            fillLight.position.set(-4, 2, -3);
            scene.add(ambientLight, hemiLight, keyLight, fillLight);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.06;
            controls.enablePan = false;
            controls.minDistance = 1.2;
            controls.maxDistance = 9.0;
            controls.target.set(0, 0, 0);
            controls.update();

            const animate = () => {
                animFrameId = requestAnimationFrame(animate);
                if (controls) controls.update();
                if (renderer && scene && camera) {
                    renderer.render(scene, camera);
                }
            };
            animate();
        }

        function resizeThreeViewer() {
            const container = document.getElementById('threeCanvasContainer');
            if (!container || !renderer || !camera) return;
            const w = container.clientWidth || 640;
            const h = container.clientHeight || 480;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }

        window.addEventListener('resize', resizeThreeViewer);

        async function loadObjectIntoStage(index) {
            if (!objects || objects.length === 0) return;
            currentIndex = (index + objects.length) % objects.length;
            const item = objects[currentIndex];
            const mySeq = ++loadSeq;

            // 좌측 패널 텍스트 업데이트 (1. 오브제 이름 / 2. 오브제 설명)
            const orderEl = document.getElementById('detailObjOrder');
            const formatEl = document.getElementById('detailObjFormat');
            const nameEl = document.getElementById('detailObjName');
            const descEl = document.getElementById('detailObjDesc');
            const deleteForm = document.getElementById('singleObjectDeleteForm');
            const arLink = document.getElementById('arQuickLookLink');

            const numStr = String(currentIndex + 1).padStart(2, '0');
            const ext = getExtension(item.modelUrl);
            const fmt = ext ? ext.replace('.', '').toUpperCase() : '3D';

            if (orderEl) orderEl.textContent = `OBJECT ${numStr}`;
            if (formatEl) formatEl.textContent = fmt;
            if (nameEl) nameEl.textContent = item.name || `오브제 ${numStr}`;
            if (descEl) {
                descEl.textContent = (item.description && item.description.trim())
                    ? item.description
                    : '등록된 오브제 상세 설명이 없습니다.';
            }
            if (deleteForm && item.id != null) {
                deleteForm.action = `/seller/goods/${goodsId}/objects/${item.id}/delete`;
            }
            if (arLink) {
                if (ext === '.usdz' && item.modelUrl) {
                    arLink.href = resolveSameOriginModelUrl(item);
                    arLink.style.display = 'inline-flex';
                } else {
                    arLink.style.display = 'none';
                }
            }

            // 좌우 화살표 표시 제어
            const prevBtn = document.getElementById('btnPrevObj');
            const nextBtn = document.getElementById('btnNextObj');
            const showNav = objects.length > 1 ? 'flex' : 'none';
            if (prevBtn) prevBtn.style.display = showNav;
            if (nextBtn) nextBtn.style.display = showNav;

            ensureThreeViewerInitialized();

            // 기존 모델 제거
            if (activeModel && scene) {
                scene.remove(activeModel);
                activeModel = null;
            }

            const loadingEl = document.getElementById('modelLoadingState');
            const spinnerEl = document.getElementById('modelSpinner');
            const loadingTextEl = document.getElementById('modelLoadingText');
            const loadingSubEl = document.getElementById('modelLoadingSub');
            const progressTrackEl = document.getElementById('modelProgressTrack');
            const progressFillEl = document.getElementById('modelProgressFill');
            const retryBtnEl = document.getElementById('btnModelRetry');

            if (loadingEl) loadingEl.classList.remove('hidden');
            if (spinnerEl) spinnerEl.style.display = 'block';
            if (loadingTextEl) loadingTextEl.textContent = '3D 모델을 불러오는 중입니다...';
            if (loadingSubEl) loadingSubEl.textContent = '데이터 스트리밍 준비 중...';
            if (progressTrackEl) progressTrackEl.style.display = 'block';
            if (progressFillEl) progressFillEl.style.width = '0%';
            if (retryBtnEl) retryBtnEl.style.display = 'none';

            resetStageCamera();

            try {
                const loadedPivot = await loadNormalized3dModel(item, (evt) => {
                    if (mySeq !== loadSeq) return;
                    if (evt && evt.lengthComputable && evt.total > 0) {
                        const pct = Math.min(99, Math.round((evt.loaded / evt.total) * 100));
                        const loadedMb = (evt.loaded / (1024 * 1024)).toFixed(1);
                        const totalMb = (evt.total / (1024 * 1024)).toFixed(1);
                        if (loadingTextEl) loadingTextEl.textContent = `3D 모델 불러오는 중... ${pct}%`;
                        if (loadingSubEl) loadingSubEl.textContent = `${loadedMb} MB / ${totalMb} MB 수신 완료`;
                        if (progressFillEl) progressFillEl.style.width = `${pct}%`;
                    } else if (evt && evt.loaded > 0) {
                        const loadedMb = (evt.loaded / (1024 * 1024)).toFixed(1);
                        if (loadingTextEl) loadingTextEl.textContent = `3D 모델 불러오는 중...`;
                        if (loadingSubEl) loadingSubEl.textContent = `${loadedMb} MB 수신 중`;
                        if (progressFillEl) progressFillEl.style.width = '65%';
                    }
                });
                if (mySeq !== loadSeq) return;
                activeModel = loadedPivot;
                scene.add(activeModel);
                if (loadingEl) loadingEl.classList.add('hidden');
            } catch (err) {
                if (mySeq !== loadSeq) return;
                if (spinnerEl) spinnerEl.style.display = 'none';
                if (progressTrackEl) progressTrackEl.style.display = 'none';
                if (loadingTextEl) {
                    loadingTextEl.textContent = `⚠️ 3D 모델을 불러올 수 없습니다 (${fmt})`;
                }
                if (loadingSubEl) {
                    loadingSubEl.textContent = '네트워크 상태를 확인하거나 아래 버튼을 눌러 다시 시도해주세요.';
                }
                if (retryBtnEl) {
                    retryBtnEl.style.display = 'inline-block';
                }
            }
        }

        window.retryCurrentStageObject = function() {
            if (!objects || objects.length === 0) return;
            const item = objects[currentIndex];
            const cacheKey = getModelCacheKey(item);
            modelTemplateCache.delete(cacheKey);
            inflightLoads.delete(cacheKey);
            loadObjectIntoStage(currentIndex);
        };

        window.openSpatialViewer = function(index) {
            const overlay = document.getElementById('spatialDetailOverlay');
            if (!overlay) return;
            overlay.classList.add('active');
            overlay.setAttribute('aria-hidden', 'false');
            document.body.style.overflow = 'hidden';
            setTimeout(() => {
                ensureThreeViewerInitialized();
                resizeThreeViewer();
                loadObjectIntoStage(index);
            }, 20);
        };

        window.closeSpatialViewer = function() {
            const overlay = document.getElementById('spatialDetailOverlay');
            if (!overlay) return;
            overlay.classList.remove('active');
            overlay.setAttribute('aria-hidden', 'true');
            document.body.style.overflow = '';
        };

        window.handleOverlayBackdrop = function(event) {
            if (event.target && event.target.id === 'spatialDetailOverlay') {
                window.closeSpatialViewer();
            }
        };

        window.stepSpatialObject = function(delta) {
            if (!objects || objects.length <= 1) return;
            loadObjectIntoStage(currentIndex + delta);
        };

        window.zoomStageCamera = function(deltaScale) {
            if (!camera || !controls) return;
            const offset = new THREE.Vector3().subVectors(camera.position, controls.target);
            const nextLen = THREE.MathUtils.clamp(offset.length() * (1 + deltaScale), controls.minDistance, controls.maxDistance);
            offset.setLength(nextLen);
            camera.position.copy(controls.target).add(offset);
            controls.update();
        };

        window.resetStageCamera = function() {
            if (!camera || !controls) return;
            controls.target.set(0, 0, 0);
            camera.position.set(0, 0.9, 3.7);
            controls.update();
        };

        document.addEventListener('keydown', (e) => {
            const overlay = document.getElementById('spatialDetailOverlay');
            if (!overlay || !overlay.classList.contains('active')) return;
            if (e.key === 'Escape') {
                window.closeSpatialViewer();
            } else if (e.key === 'ArrowLeft') {
                window.stepSpatialObject(-1);
            } else if (e.key === 'ArrowRight') {
                window.stepSpatialObject(1);
            }
        });
    </script>
</body>
</html>
