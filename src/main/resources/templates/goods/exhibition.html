<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title th:text="${goods.name} + ' - 3D 오브제 전시관 | 룸테라피'">3D 오브제 전시관 - 룸테라피</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <!-- Three.js ESM Import Map (.glb, .gltf, .fbx, .obj, .usdz 로더 지원: GLB, FBX, OBJ, USDZ) -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <!-- 3D 오브제 전시관 전용 외부 스타일시트 (css/goods-exhibition.css) -->
    <link rel="stylesheet" href="/css/goods-exhibition.css">
</head>
<body>
    <main class="spatial-room" id="spatialRoom">
        <div class="exh-topbar">
            <a href="/goods" class="btn-back">&lt; 돌아가기</a>
            <!-- 판매자/관리자 전용 수정 버튼 -->
            <a th:if="${canManage}"
               th:href="@{'/seller/goods/' + ${goods.id} + '/edit#section-3d-objects'}"
               class="btn-manage-objects">오브제 수정</a>
        </div>

        <div class="flash-banner success" th:if="${successMessage != null}" th:text="${successMessage}"></div>
        <div class="flash-banner error" th:if="${errorMessage != null}" th:text="${errorMessage}"></div>

        <h1 class="gallery-intro-title" th:text="${goods.name} + ' 스테이지 오브제 전시관'">스테이지 오브제 전시관</h1>
        <p class="gallery-intro-desc">그림을 누르면 전시된 3D 오브제와 설명을 확인할 수 있어요.</p>

        <!-- 등록된 3D 오브제가 없는 경우 -->
        <div class="empty-exhibition-box" th:if="${objects3d == null or objects3d.empty}">
            <img class="empty-monkey" src="/images/monkey_light_color.png" alt="">
            <h2 class="empty-exhibition-title">앗! 아직 전시된 오브제가 없어요.<br>곧 새로운 오브제로 찾아올게요!</h2>
            <a th:if="${canManage}"
               th:href="@{'/seller/goods/' + ${goods.id} + '/edit#section-3d-objects'}"
               class="btn-manage-objects">+ 3D 오브제 등록하러 가기</a>
        </div>

        <!-- 오브제 그리드 -->
        <div th:if="${objects3d != null and !objects3d.empty}">
            <div class="gallery-wall-grid" id="galleryWallGrid">
                <div class="gallery-frame-card"
                     th:each="obj, stat : ${objects3d}"
                     th:data-index="${stat.index}"
                     onclick="openSpatialViewer(Number(this.getAttribute('data-index')))">
                    <div class="gallery-frame-mat">
                        <span class="frame-index-tag" th:text="${#numbers.formatInteger(stat.count, 2)}">01</span>
                        <div class="frame-thumb-canvas-wrap">
                            <img class="frame-thumb-img"
                                 th:id="'frameThumbImg-' + ${stat.index}"
                                 th:src="${obj.thumbnailUrl != null and !obj.thumbnailUrl.isBlank() ? obj.thumbnailUrl : ''}"
                                 th:style="${obj.thumbnailUrl != null and !obj.thumbnailUrl.isBlank() ? 'display:block;' : 'display:none;'}"
                                 th:alt="${obj.name}">
                            <div class="frame-thumb-placeholder"
                                 th:id="'frameThumbPlaceholder-' + ${stat.index}"
                                 th:style="${obj.thumbnailUrl != null and !obj.thumbnailUrl.isBlank() ? 'display:none;' : 'display:flex;'}">
                                <span class="frame-cube-icon" style="font-size: 26px; opacity: 0.25;">🏛️</span>
                                <span class="frame-loading-text" th:text="${obj.name != null and !obj.name.isBlank() ? obj.name : '3D 오브제'}">3D 오브제</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 3D 오브제 상세 뷰어 -->
    <div id="spatialDetailOverlay" class="spatial-detail-overlay" aria-hidden="true">
        <div class="spatial-detail-layout">
            <div class="detail-topbar">
                <div class="detail-topbar-left">
                    <button type="button" class="btn-back" onclick="closeSpatialViewer()">&lt; 돌아가기</button>
                    <button type="button" id="btnPrevObj" class="btn-spatial-nav prev" onclick="stepSpatialObject(-1)">이전 오브제</button>
                </div>
                <div class="detail-topbar-right">
                    <button type="button" id="btnNextObj" class="btn-spatial-nav next" onclick="stepSpatialObject(1)">다음 오브제 보기</button>
                </div>
            </div>

            <section class="spatial-stage-panel">
                <div id="modelLoadingState" class="model-loading-state">
                    <div id="modelSpinner" class="model-spinner"></div>
                    <div class="model-loading-label" id="modelLoadingText">3D 모델을 불러오는 중입니다...</div>
                    <div class="model-loading-sub" id="modelLoadingSub">잠시만 기다려주세요</div>
                    <div id="modelProgressTrack" class="model-progress-track">
                        <div id="modelProgressFill" class="model-progress-fill"></div>
                    </div>
                    <button type="button" id="btnModelRetry" class="btn-model-retry" onclick="retryCurrentStageObject()">↻ 다시 불러오기</button>
                </div>

                <div id="threeCanvasContainer"></div>

                <a id="arQuickLookLink" rel="ar" href="#" class="btn-ar-quicklook">🥽 AR 공간 보기</a>

                <div class="stage-zoom-controls">
                    <button type="button" class="btn-stage-ctrl" onclick="zoomStageCamera(-0.22)" title="확대">+</button>
                    <button type="button" class="btn-stage-ctrl" onclick="zoomStageCamera(0.22)" title="축소">&minus;</button>
                </div>
            </section>

            <aside class="spatial-info-panel">
                <div>
                    <div class="info-top-meta">
                        <span class="info-artwork-label" id="detailObjOrder">ARTWORK 01</span>
                        <span class="info-format-badge" id="detailObjFormat">GLB</span>
                    </div>
                    <h2 class="info-object-title" id="detailObjName">오브제 이름</h2>
                    <p class="info-object-desc" id="detailObjDesc">오브제 설명</p>
                </div>

                <div class="info-bottom-area">
                    <!-- 판매자/관리자 전용 -->
                    <div class="info-seller-actions" th:if="${canManage}">
                        <a th:href="@{'/seller/goods/' + ${goods.id} + '/edit#section-3d-objects'}" class="btn-detail-edit">수정/추가</a>
                        <form id="singleObjectDeleteForm" method="post" style="flex:1;display:flex;" onsubmit="return confirm('이 3D 오브제를 전시관에서 삭제하시겠습니까?');">
                            <input type="hidden" name="redirect" th:value="'/goods/' + ${goods.id} + '/exhibition'">
                            <button type="submit" class="btn-detail-delete" style="width:100%;">삭제</button>
                        </form>
                    </div>
                    <div class="info-rotate-hint">
                        <span>↻</span>
                        <span>Drag to rotate model</span>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <!-- 서버 데이터를 JS에 주입 -->
    <script th:inline="javascript">
        /*<![CDATA[*/
        window.EXHIBITION_GOODS_ID = /*[[${goods.id}]]*/ 0;
        window.EXHIBITION_OBJECTS = /*[[${objects3d}]]*/ [];
        /*]]>*/
    </script>

    <!-- Three.js 3D 오브제 전시관 인터랙티브 엔진 모듈 (js/goods-exhibition.js) -->
    <script type="module" src="/js/goods-exhibition.js"></script>
</body>
</html>
