<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>안내 - Room Therapy</title>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-main: #0F172A;
            --text-sub: #64748B;
            --error: #EF4444;
            --error-bg: #FEF2F2;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px 16px;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 40px 32px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
            text-align: center;
        }
        .icon-circle {
            width: 72px;
            height: 72px;
            background: #FEE2E2;
            color: var(--error);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            margin: 0 auto 20px auto;
        }
        .badge {
            display: inline-block;
            background: #F1F5F9;
            color: var(--text-sub);
            font-weight: 700;
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 999px;
            margin-bottom: 12px;
        }
        h1 {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
            color: var(--text-main);
        }
        .message-box {
            background: #FEF2F2;
            border: 1px solid #FECACA;
            border-radius: 16px;
            padding: 16px 20px;
            margin: 20px 0 28px 0;
            text-align: left;
        }
        .message-text {
            font-size: 15px;
            font-weight: 600;
            color: #991B1B;
            line-height: 1.5;
            word-break: keep-all;
        }
        .code-text {
            font-size: 12px;
            color: #B91C1C;
            margin-top: 6px;
            font-family: monospace;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        .btn {
            flex: 1;
            padding: 14px 16px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
        }
        .btn-outline {
            background: #FFFFFF;
            color: var(--text-main);
            border: 1px solid #CBD5E1;
        }
        .btn-outline:hover {
            background: #F8FAFC;
            border-color: #94A3B8;
        }
        .btn-primary {
            background: var(--primary);
            color: #FFFFFF;
        }
        .btn-primary:hover {
            background: var(--primary-hover);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="icon-circle">
        🛋️
    </div>

    <div class="badge" th:if="${status != null}" th:text="'HTTP ' + ${status}">HTTP 400</div>

    <h1>안내 드립니다</h1>

    <div class="message-box">
        <div class="message-text" th:text="${message != null ? message : '요청을 처리하는 도중 문제가 발생했습니다.'}">
            알 수 없는 오류가 발생했습니다.
        </div>
        <div class="code-text" th:if="${code != null}" th:text="'Code: ' + ${code}">
            Code: 400
        </div>
    </div>

    <!-- 이전으로 돌아가기 & 홈으로 이동 버튼 -->
    <div class="btn-group">
        <button type="button" onclick="history.back()" class="btn btn-outline">
            🔙 이전으로
        </button>
        <a href="/" class="btn btn-primary">
            🏠 홈으로
        </a>
    </div>
</div>

</body>
</html>
