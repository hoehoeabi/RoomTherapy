<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>안내 - Room Therapy</title>
    <!-- 공통 에러 안내 화면 스타일시트 모듈 (CSS 모듈화) -->
    <link rel="stylesheet" th:href="@{/css/error.css}" href="/css/error.css">
</head>
<body>

<div class="container">
    <div class="icon-circle">
        <span th:if="${status == 401}">🔒</span>
        <span th:if="${status == 403}">🚫</span>
        <span th:if="${status == 404}">🔍</span>
        <span th:if="${status == 413}">📦</span>
        <span th:if="${status == 500}">⚠️</span>
        <span th:if="${status != 401 and status != 403 and status != 404 and status != 413 and status != 500}">🛋️</span>
    </div>

    <div class="badge" th:if="${status != null}" th:text="'HTTP ' + ${status}">HTTP 400</div>

    <h1>안내 드립니다</h1>

    <div class="message-box">
        <div class="message-text" th:text="${message != null ? message : '요청을 처리하는 도중 문제가 발생했습니다.'}">
            알 수 없는 오류가 발생했습니다.
        </div>
        <div class="code-text" th:if="${code != null}" th:text="'Code: ' + ${code}">
            Code: 400
        </div>
    </div>

    <!-- 401 미인증인 경우 카카오 소셜 로그인 바로가기 버튼 제공 -->
    <div class="btn-group" th:if="${status == 401}">
        <a href="/oauth2/authorization/kakao" class="btn btn-kakao">
            💬 카카오 로그인
        </a>
        <a href="/" class="btn btn-outline">
            🏠 홈으로
        </a>
    </div>

    <!-- 일반 에러인 경우 이전으로 돌아가기 & 홈으로 이동 버튼 -->
    <div class="btn-group" th:if="${status != 401}">
        <button type="button" onclick="history.back()" class="btn btn-outline">
            🔙 이전으로
        </button>
        <a href="/" class="btn btn-primary">
            🏠 홈으로
        </a>
    </div>
</div>

</body>
</html>
