<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>굿즈 등록 인증코드 목록 - Room Therapy</title>
    <style>
        :root {
            --primary: #4F46E5;
            --bg: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-main: #0F172A;
            --text-sub: #64748B;
            --border: #E2E8F0;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding: 32px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 680px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 24px;
            font-weight: 800;
        }
        .btn-back {
            text-decoration: none;
            color: var(--text-sub);
            font-size: 14px;
            font-weight: 600;
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 10px;
            background: #FFFFFF;
        }
        .card {
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px solid var(--border);
            padding: 28px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.04);
        }
        .goods-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
            margin-bottom: 20px;
        }
        .code-item {
            background: #F8FAFC;
            border: 1px solid var(--border);
            padding: 10px 14px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 14px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>🔑 굿즈 인증코드 목록</h1>
                <p style="color: var(--text-sub); font-size: 13px; margin-top: 4px;">유니티 게임 클라이언트와 연동되는 유효 코드 목록입니다.</p>
            </div>
            <div>
                <a href="/goods" class="btn-back">굿즈 목록으로</a>
            </div>
        </div>

        <div class="card">
            <div class="goods-info">
                <div>
                    <h2 style="font-size: 18px; font-weight: 800;" th:text="${goods.name}">시바견 원목 피규어</h2>
                    <p style="color: var(--text-sub); font-size: 13px; margin-top: 2px;">
                        재고: <span th:text="${goods.stockQuantity} + '개'">10개</span> |
                        등록된 유효 코드 수: <span th:text="${goods.authCodeCount} + '개'" style="color: var(--primary); font-weight: 700;">3개</span>
                    </p>
                </div>
                <span style="font-size: 12px; font-weight: 700; background: #EEF2FF; color: var(--primary); padding: 4px 10px; border-radius: 999px;"
                      th:text="${goods.status}">ACTIVE</span>
            </div>

            <div th:if="${#lists.isEmpty(goods.authCodes)}" style="text-align: center; color: var(--text-sub); padding: 30px;">
                등록된 인증코드가 없습니다.
            </div>

            <div th:unless="${#lists.isEmpty(goods.authCodes)}">
                <div th:each="code, iterStat : ${goods.authCodes}" class="code-item">
                    <span th:text="${code}">EW-STAGE1-01</span>
                    <span style="font-size: 11px; color: var(--text-sub); font-family: sans-serif;" th:text="'#' + ${iterStat.count}">#1</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
