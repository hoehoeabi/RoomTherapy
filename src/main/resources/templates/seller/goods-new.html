<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>새 굿즈 및 인증코드 등록 - Room Therapy</title>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-main: #0F172A;
            --text-sub: #64748B;
            --border: #E2E8F0;
            --error: #EF4444;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding: 32px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 680px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        .btn-back {
            text-decoration: none;
            color: var(--text-sub);
            font-size: 14px;
            font-weight: 600;
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 10px;
            background: #FFFFFF;
        }
        .card {
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px solid var(--border);
            padding: 32px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.04);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .label-desc {
            font-size: 12px;
            font-weight: 400;
            color: var(--text-sub);
            margin-top: 2px;
        }
        input, textarea {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid var(--border);
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }
        input:focus, textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        textarea {
            font-family: monospace;
            resize: vertical;
            min-height: 120px;
            line-height: 1.5;
        }
        .field-error {
            color: var(--error);
            font-size: 12px;
            margin-top: 6px;
            display: block;
        }
        .alert-error {
            background: #FEF2F2;
            color: var(--error);
            border: 1px solid #FECACA;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .btn-gen {
            background: #EEF2FF;
            color: var(--primary);
            border: 1px solid #C7D2FE;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
        }
        .btn-submit {
            width: 100%;
            background: var(--primary);
            color: #FFFFFF;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background: var(--primary-hover);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>🎁 새 굿즈 & 인증코드 등록</h1>
                <p style="color: var(--text-sub); font-size: 13px; margin-top: 4px;">유니티 게임에서 수령 가능한 굿즈와 유효 인증코드를 등록합니다.</p>
            </div>
            <div>
                <a href="/seller/deliveries" class="btn-back">대시보드로 돌아가기</a>
            </div>
        </div>

        <div class="alert-error" th:if="${errorMessage != null}" th:text="${errorMessage}"></div>

        <div class="card">
            <form th:action="@{/seller/goods}" th:object="${form}" method="post">
                <div class="form-group">
                    <label for="name">굿즈 명칭 <span style="color: var(--error);">*</span></label>
                    <input type="text" id="name" th:field="*{name}" placeholder="예: 시바견 원목 피규어, 룸테라피 무드등" required>
                    <span class="field-error" th:errors="*{name}"></span>
                </div>

                <div class="form-group">
                    <label for="description">굿즈 설명</label>
                    <textarea id="description" th:field="*{description}" placeholder="굿즈에 대한 상세 설명을 입력하세요."></textarea>
                    <span class="field-error" th:errors="*{description}"></span>
                </div>

                <div class="form-group">
                    <label for="imageUrl">이미지 URL</label>
                    <input type="text" id="imageUrl" th:field="*{imageUrl}" placeholder="https://example.com/goods.png 또는 /images/sample.png">
                    <span class="field-error" th:errors="*{imageUrl}"></span>
                </div>

                <div class="form-group">
                    <label for="stockQuantity">준비된 재고 수량 <span style="color: var(--error);">*</span></label>
                    <input type="number" id="stockQuantity" th:field="*{stockQuantity}" min="1" required>
                    <span class="field-error" th:errors="*{stockQuantity}"></span>
                </div>

                <!-- 인증코드 등록 영역 -->
                <div class="form-group" style="background: #F8FAFC; border: 1px dashed var(--border); padding: 18px; border-radius: 14px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                        <label for="authCodesInput" style="margin-bottom: 0;">🔑 유니티 인증코드 목록</label>
                        <button type="button" class="btn-gen" onclick="generateRandomCodes()">🎲 UUID 5개 자동 생성</button>
                    </div>
                    <div class="label-desc" style="margin-bottom: 10px;">
                        유니티에 하드코딩될 코드 묶음(예: dog-01, dog-02 또는 a, b, c)을 줄바꿈 또는 쉼표(,)로 구분하여 입력하세요.
                        유저는 게임 클리어 시 이 중 하나를 받아 배송 신청을 진행하게 됩니다.
                    </div>
                    <textarea id="authCodesInput" th:field="*{authCodesInput}" placeholder="예:&#10;DOG-STAGE1-A&#10;DOG-STAGE1-B&#10;DOG-STAGE1-C"></textarea>
                    <span class="field-error" th:errors="*{authCodesInput}"></span>
                </div>

                <button type="submit" class="btn-submit">굿즈 등록 완료</button>
            </form>
        </div>
    </div>

    <script>
        function generateRandomCodes() {
            const textarea = document.getElementById('authCodesInput');
            const prefix = 'RT-';
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let newCodes = [];
            for (let i = 0; i < 5; i++) {
                let code = prefix;
                for (let j = 0; j < 8; j++) {
                    code += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                newCodes.push(code);
            }
            if (textarea.value.trim().length > 0) {
                textarea.value = textarea.value.trim() + '\n' + newCodes.join('\n');
            } else {
                textarea.value = newCodes.join('\n');
            }
        }
    </script>
</body>
</html>
