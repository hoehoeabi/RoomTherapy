<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>새 굿즈 및 인증코드 등록 - 룸테라피</title>
    <style>
        :root {
            --red: #FF4B4E;
            --title: #020202;
            --text: #3C3C3C;
            --gray: #838383;
            --bg-light: #F7F8FA;
            --border-light: #E5E7EB;
            --input-radius: 8px;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #EFEFEF;
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }
        .app-container {
            width: 100%;
            max-width: 390px;
            min-height: 100vh;
            background: #FAFAFA;
            padding: 24px 16px 40px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
        }
        @media (max-width: 440px) {
            body {
                background-color: #FAFAFA;
            }
            .app-container {
                box-shadow: none;
                min-height: 100dvh;
                padding: 20px 14px 32px;
            }
        }
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }
        .header-title-wrap h1 {
            font-size: 20px;
            font-weight: 800;
            color: var(--title);
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }
        .header-title-wrap p {
            font-size: 11px;
            color: var(--gray);
            letter-spacing: -0.2px;
        }
        .btn-home {
            font-size: 12px;
            color: var(--gray);
            text-decoration: none;
            padding: 4px 0;
            font-weight: 500;
        }
        .btn-home:hover {
            color: var(--title);
        }
        .card {
            background: #FFFFFF;
            border-radius: 14px;
            padding: 18px 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            margin-bottom: 14px;
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--title);
            display: block;
            margin-bottom: 6px;
        }
        .form-label-desc {
            font-size: 10.5px;
            color: var(--gray);
            margin-bottom: 6px;
            line-height: 1.4;
        }
        .input-text {
            width: 100%;
            height: 38px;
            padding: 0 12px;
            border-radius: var(--input-radius);
            border: 1px solid var(--border-light);
            font-size: 13px;
            color: var(--text);
            outline: none;
            background: #FFFFFF;
        }
        .input-text:focus {
            border-color: var(--red);
        }
        textarea.input-text {
            height: 80px;
            padding: 8px 12px;
            resize: vertical;
        }
        textarea.code-area {
            height: 100px;
            font-family: monospace;
            font-size: 12px;
            line-height: 1.4;
        }
        .btn-gen {
            background: #FFEBEB;
            color: var(--red);
            border: none;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-submit {
            width: 100%;
            height: 44px;
            background: var(--red);
            color: #FFFFFF;
            font-size: 14px;
            font-weight: 700;
            border-radius: var(--input-radius);
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 75, 78, 0.28);
            margin-top: 6px;
            transition: opacity 0.15s ease;
        }
        .btn-submit:active {
            opacity: 0.92;
        }
        .field-error {
            color: var(--red);
            font-size: 11px;
            margin-top: 4px;
            display: block;
        }
        .alert-error {
            background: #FFEBEB;
            color: var(--red);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 14px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 헤더 영역 -->
        <div class="page-header">
            <div class="header-title-wrap">
                <h1>새 굿즈 등록</h1>
                <p>유니티 게임 클리어 리워드 및 인증코드를 등록합니다.</p>
            </div>
            <a href="/goods" class="btn-home">돌아가기</a>
        </div>

        <div class="alert-error" th:if="${errorMessage != null}" th:text="${errorMessage}"></div>

        <div class="card">
            <form th:action="@{/seller/goods}" th:object="${form}" method="post" enctype="multipart/form-data">
                <div class="form-group">
                    <label class="form-label" for="name">굿즈 명칭 <span style="color: var(--red);">*</span></label>
                    <input type="text" id="name" th:field="*{name}" class="input-text" placeholder="예: 룸테라피 아늑한 무드등 (스테이지 1 리워드)" required>
                    <span class="field-error" th:errors="*{name}"></span>
                </div>

                <div class="form-group">
                    <label class="form-label" for="description">굿즈 설명</label>
                    <textarea id="description" th:field="*{description}" class="input-text" placeholder="은은하고 따뜻한 주황빛으로 지친 하루를 밝혀주는 무드등"></textarea>
                    <span class="field-error" th:errors="*{description}"></span>
                </div>

                <div class="form-group" style="background: var(--bg-light); padding: 12px; border-radius: 10px;">
                    <label class="form-label" style="margin-bottom: 2px;">굿즈 사진 등록 <span style="color: var(--red);">*</span></label>
                    <div class="form-label-desc">스마트폰 앨범 또는 PC에서 사진들을 여러 장 선택해 등록하세요 (최소 1장 필수, 슬라이드 뷰 자동 연동).</div>
                    <input type="file" id="imageFiles" name="imageFiles" multiple accept="image/*" class="input-text" style="height: auto; padding: 8px; background: #FFFFFF; margin-bottom: 8px;">
                    <div class="form-label-desc">또는 이미지 URL 직접 입력:</div>
                    <input type="text" id="imageUrl" th:field="*{imageUrl}" class="input-text" placeholder="https://... 또는 /images/RoomTherapy_logo.png (쉼표로 구분)">
                    <span class="field-error" th:errors="*{imageUrl}"></span>
                </div>

                <div class="form-group">
                    <label class="form-label" for="stockQuantity">준비된 재고 수량 <span style="color: var(--red);">*</span></label>
                    <input type="number" id="stockQuantity" th:field="*{stockQuantity}" class="input-text" min="1" placeholder="50" required>
                    <span class="field-error" th:errors="*{stockQuantity}"></span>
                </div>

                <!-- 인증코드 등록 영역 (필수) -->
                <div class="form-group" style="background: var(--bg-light); padding: 12px; border-radius: 10px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                        <label class="form-label" for="authCodesInput" style="margin-bottom: 0;">인증코드 목록 <span style="color: var(--red);">*</span></label>
                        <button type="button" class="btn-gen" onclick="generateRandomCodes()">+ 5개 자동 생성</button>
                    </div>
                    <div class="form-label-desc">
                        유니티에 배포될 클리어 인증코드들을 줄바꿈(Enter)으로 구분해 입력하세요 (최소 1개 필수).
                    </div>
                    <textarea id="authCodesInput" th:field="*{authCodesInput}" class="input-text code-area" placeholder="RT-A8F2K9Z&#10;RT-Q7W1E5R" required></textarea>
                    <span class="field-error" th:errors="*{authCodesInput}"></span>
                </div>

                <button type="submit" class="btn-submit">굿즈 등록 완료</button>
            </form>
        </div>
    </div>

    <script>
        function generateRandomCodes() {
            const textarea = document.getElementById('authCodesInput');
            const prefix = 'RT-';
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let newCodes = [];
            for (let i = 0; i < 5; i++) {
                let code = prefix;
                for (let j = 0; j < 6; j++) {
                    code += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                newCodes.push(code);
            }
            if (textarea.value.trim().length > 0) {
                textarea.value = textarea.value.trim() + '\n' + newCodes.join('\n');
            } else {
                textarea.value = newCodes.join('\n');
            }
        }
    </script>
</body>
</html>
