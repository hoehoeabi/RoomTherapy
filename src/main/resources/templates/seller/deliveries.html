<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>판매자 - 굿즈 배송 주문 관리</title>
    <style>
        :root {
            --primary: #059669;
            --primary-hover: #047857;
            --bg: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-main: #0F172A;
            --text-sub: #64748B;
            --border: #E2E8F0;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding: 32px 24px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto 28px;
        }
        h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        .seller-badge {
            display: inline-block;
            background: #ECFDF5;
            color: var(--primary);
            font-size: 13px;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 999px;
            margin-right: 12px;
        }
        .card {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .table-wrap {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }
        th {
            background: #F1F5F9;
            color: var(--text-sub);
            font-weight: 600;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        td {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }
        tr:hover {
            background-color: #F8FAFC;
        }
        .code-tag {
            background: #F1F5F9;
            padding: 4px 8px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 13px;
            font-weight: 700;
            color: var(--primary);
        }
        .status-select {
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 13px;
            font-weight: 600;
            outline: none;
            background: #FFFFFF;
        }
        .btn-update {
            padding: 6px 12px;
            background: var(--primary);
            color: #FFFFFF;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            margin-left: 6px;
        }
        .empty-state {
            padding: 60px 20px;
            text-align: center;
            color: var(--text-sub);
        }
        .btn-home {
            text-decoration: none;
            color: var(--text-sub);
            font-size: 14px;
            font-weight: 600;
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 10px;
            background: #FFFFFF;
        }
        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }
        .tab-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            border: 1px solid var(--border);
            background: #FFFFFF;
            color: var(--text-sub);
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--primary);
            color: #FFFFFF;
            border-color: var(--primary);
        }
        .tab-count {
            background: rgba(0, 0, 0, 0.08);
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 12px;
        }
        .tab-btn.active .tab-count {
            background: rgba(255, 255, 255, 0.25);
            color: #FFFFFF;
        }
        .modified-pill {
            display: inline-block;
            background: #FEF3C7;
            color: #D97706;
            font-size: 11px;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 6px;
            margin-left: 4px;
        }
        .modified-time {
            display: block;
            font-size: 11px;
            color: #D97706;
            margin-top: 3px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <span class="seller-badge">SELLER DASHBOARD</span>
            <h1>🏪 내 굿즈 배송 주문 관리</h1>
        </div>
        <div>
            <a href="/" class="btn-home">홈으로 가기</a>
        </div>
    </div>

    <div style="max-width: 1200px; margin: 0 auto;">
        <!-- 탭 네비게이션: 전체 목록 vs 수정된 신청 목록 -->
        <div class="tabs">
            <a th:href="@{/seller/deliveries(filter='all')}" 
               th:class="${currentFilter == 'all' ? 'tab-btn active' : 'tab-btn'}">
                전체 주문 신청
                <span class="tab-count" th:text="${allCount}">0</span>
            </a>
            <a th:href="@{/seller/deliveries(filter='modified')}" 
               th:class="${currentFilter == 'modified' ? 'tab-btn active' : 'tab-btn'}">
                ⚠️ 사용자가 수정한 주문
                <span class="tab-count" th:text="${modifiedCount}">0</span>
            </a>
        </div>
    </div>

    <div class="card">
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>주문 ID</th>
                        <th>신청일시</th>
                        <th>신청 상품</th>
                        <th>수령인</th>
                        <th>연락처</th>
                        <th>우편번호</th>
                        <th>배송지 주소</th>
                        <th>배송 상태 변경</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="delivery : ${deliveries}" th:style="${delivery.isModified ? 'background-color: #FFFDF5;' : ''}">
                        <td>
                            <span th:text="${'#' + delivery.id}">#1</span>
                            <span th:if="${delivery.isModified}" class="modified-pill">수정됨</span>
                        </td>
                        <td>
                            <div th:text="${#temporals.format(delivery.createdAt, 'yyyy-MM-dd HH:mm')}">2026-10-21 20:00</div>
                            <span th:if="${delivery.isModified and delivery.updatedAt != null}" class="modified-time" 
                                  th:text="${'수정: ' + #temporals.format(delivery.updatedAt, 'MM-dd HH:mm')}">수정: 10-21 21:00</span>
                        </td>
                        <td th:text="${delivery.goodsName}">스테이지 리워드</td>
                        <td th:text="${delivery.recipientName}">홍길동</td>
                        <td th:text="${delivery.phone}">010-1234-5678</td>
                        <td th:text="${delivery.zipcode}">12345</td>
                        <td th:text="${delivery.address + ' ' + (delivery.detailAddress != null ? delivery.detailAddress : '')}">
                            서울특별시 강남구 테헤란로 123 402호
                        </td>
                        <td>
                            <form th:action="@{'/seller/deliveries/' + ${delivery.id} + '/status'}" method="post" style="display: flex; align-items: center;">
                                <select name="status" class="status-select">
                                    <option th:each="st : ${statuses}" 
                                            th:value="${st}" 
                                            th:text="${st.description}"
                                            th:selected="${st == delivery.status}">
                                    </option>
                                </select>
                                <button type="submit" class="btn-update">변경</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(deliveries)}">
                        <td colspan="8" class="empty-state">
                            <span th:if="${currentFilter == 'modified'}">사용자가 수정한 배송 신청 건이 없습니다.</span>
                            <span th:unless="${currentFilter == 'modified'}">아직 등록된 굿즈 배송 주문이 없습니다.</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
