server:
  port: 8080
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        secure: false # 로컬 테스트 시 false, 추후 HTTPS 배포 시 true
        same-site: lax

spring:
  application:
    name: roomtherapy

  profiles:
    active: local

  config:
    import:
      - optional:file:.env[.properties]
      - optional:application-secret.yml

  # ==========================================
  # OAuth2 카카오 설정 (기본 프레임워크 규격)
  # ==========================================
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID:}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize?prompt=login
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  # Redis 설정 (로컬 Redis 기본값)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# JWT 커스텀 설정
jwt:
  secret: ${JWT_SECRET:${JWT_SECRET_KEY:}}
  access-token-expiration: 1800000   # 30분 (ms 단위)
  refresh-token-expiration: 604800000 # 7일 (ms 단위)

# 관리자 및 판매자 계정 설정 (카카오 ID 목록)
admin:
  kakao-ids: ${ADMIN_KAKAO_IDS:}

seller:
  kakao-ids: ${SELLER_KAKAO_IDS:}

# Springdoc OpenAPI / Swagger 설정
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
    doc-expansion: none
